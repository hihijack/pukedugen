<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>地牢探险 - 单人卡牌桌游</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0;
        }
        body {
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #game-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(120, 80, 255, 0.35), 0 0 80px rgba(80, 40, 200, 0.15);
            max-width: 100vw;
            max-height: 100dvh;
            max-height: 100vh;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
        }
        #game-container canvas {
            display: block;
            image-rendering: auto;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js">
    </script>
    <script>
    // ═══════════════════════════════════════════════════════════════
    //  CONSTANTS
    // ═══════════════════════════════════════════════════════════════
    const MAX_HP = 20;
    const CARDS_PER_ROOM = 4;
    const MIN_CARDS_TO_PASS = 3;
    const DECK_MONSTERS = 28;
    const DECK_WEAPONS = 10;
    const DECK_POTIONS = 10;
    const DECK_TOTAL = DECK_MONSTERS + DECK_WEAPONS + DECK_POTIONS; // 48
    const CANVAS_W = 480;
    const CANVAS_H = 800;

    const CARD_W = 160;
    const CARD_H = 210;
    // 2×2 grid: index 0=tl, 1=tr, 2=bl, 3=br
    const CARD_X = [133, 347, 133, 347];
    const CARD_Y = [160, 160, 390, 390];

    const COLORS = {
        bg:       0x12122a,
        headerBg: 0x1a1a3e,
        monster:  0xc0392b,
        monsterDark: 0x7b1810,
        monsterLight: 0xe74c3c,
        weapon:   0x2471a3,
        weaponDark: 0x123a54,
        weaponLight: 0x3498db,
        potion:   0x1e8449,
        potionDark: 0x0f4224,
        potionLight: 0x2ecc71,
        hpGreen:  0x2ecc71,
        hpYellow: 0xf39c12,
        hpRed:    0xe74c3c,
        gold:     0xf0c040,
        textLight:0xe8e8f0,
        textDim:  0x8888aa,
        overlay:  0x000000,
        buttonBg: 0x6c3cc0,
        buttonHover: 0x8b5cf0,
        cardSlot: 0x1e1e40,
    };

    const THEMES = {
        dark: {
            bg:         0x12122a,
            headerBg:   0x1a1a3e,
            textLight:  0xe8e8f0,
            textDim:    0x8888aa,
            accent:     0xf0c040,
            gridColor:  0x1a1a3e,
            gridAlpha:  0.3,
            divider:    0x3a3a6a,
            cardMonsterBg: 0x7b1810, cardMonsterBorder: 0xc0392b,
            cardWeaponBg:  0x123a54, cardWeaponBorder:  0x2471a3,
            cardPotionBg:  0x0f4224, cardPotionBorder:  0x1e8449,
        },
        light: {
            bg:         0xf5f0e8,
            headerBg:   0xe8e2d5,
            textLight:  0x333344,
            textDim:    0x778899,
            accent:     0xb08000,
            gridColor:  0xd8d0c0,
            gridAlpha:  0.4,
            divider:    0xc8c0b0,
            cardMonsterBg: 0xe0c8c4, cardMonsterBorder: 0xa03028,
            cardWeaponBg:  0xc8d4e4, cardWeaponBorder:  0x1e6090,
            cardPotionBg:  0xc4e0d0, cardPotionBorder:  0x186838,
        }
    };

    // ═══════════════════════════════════════════════════════════════
    //  GAME STATE
    // ═══════════════════════════════════════════════════════════════
    let gameState;

    function resetGameState() {
        return {
            playerHP: MAX_HP,
            maxHP: MAX_HP,
            weapon: null,           // { atk: number, level: number | Infinity }
            useWeapon: true,        // toggle: use weapon in combat?
            canSkip: true,          // can skip current room? (false after a skip)
            deck: [],               // remaining cards
            roomCards: [],          // 4 current room cards
            roomProcessed: [],      // boolean[4]
            roomNumber: 1,
            processedCount: 0,
            gameOver: false,
            gameWon: false,
        };
    }

    // ═══════════════════════════════════════════════════════════════
    //  CARD FACTORY
    // ═══════════════════════════════════════════════════════════════
    function generateDeck() {
        const deck = [];
        // 28 monsters: 2 each of HP 1–14
        for (let hp = 1; hp <= 14; hp++) {
            deck.push({ type: 'monster', hp: hp });
            deck.push({ type: 'monster', hp: hp });
        }
        // 10 weapons: ATK 1–10, one each
        for (let atk = 1; atk <= 10; atk++) {
            deck.push({ type: 'weapon', atk: atk });
        }
        // 10 potions: heal 1–10, one each
        for (let heal = 1; heal <= 10; heal++) {
            deck.push({ type: 'potion', heal: heal });
        }
        Phaser.Utils.Array.Shuffle(deck);
        return deck;
    }

    // ═══════════════════════════════════════════════════════════════
    //  PHASER CONFIG
    // ═══════════════════════════════════════════════════════════════
    const config = {
        type: Phaser.AUTO,
        width: CANVAS_W,
        height: CANVAS_H,
        parent: 'game-container',
        backgroundColor: '#12122a',
        render: {
            antialias: true,
            roundPixels: true,
            powerPreference: 'high-performance'
        },
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
            autoRound: true
        },
        scene: {
            preload: preload,
            create: create
        }
    };

    const game = new Phaser.Game(config);

    // ═══════════════════════════════════════════════════════════════
    //  SCENE: PRELOAD — Generate card textures
    // ═══════════════════════════════════════════════════════════════
    function preload() {
        const g = this.make.graphics({ add: false });

        function drawMonsterIcon() {
            g.fillStyle(0xffffff, 0.15);
            g.fillCircle(CARD_W / 2, 48, 20);
            g.fillStyle(0x000000, 0.6);
            g.fillCircle(CARD_W / 2 - 7, 42, 4);
            g.fillCircle(CARD_W / 2 + 7, 42, 4);
            g.fillStyle(0xffffff, 0.25);
            g.fillRect(CARD_W / 2 - 9, 54, 18, 3);
            g.fillRect(CARD_W / 2 - 3, 50, 6, 8);
        }
        function drawWeaponIcon() {
            g.fillStyle(0xffffff, 0.15);
            g.fillRect(CARD_W / 2 - 2, 26, 4, 32);
            g.fillRect(CARD_W / 2 - 14, 50, 28, 5);
            g.fillRect(CARD_W / 2 - 1, 42, 3, 14);
            g.fillStyle(0xffffff, 0.08);
            g.fillCircle(CARD_W / 2, 28, 5);
        }
        function drawPotionIcon() {
            g.fillStyle(0xffffff, 0.15);
            g.fillRect(CARD_W / 2 - 7, 30, 14, 5);
            g.fillRect(CARD_W / 2 - 3, 25, 7, 7);
            g.fillRect(CARD_W / 2 - 10, 35, 21, 18);
            g.fillStyle(0xffffff, 0.08);
            g.fillRect(CARD_W / 2 - 8, 48, 17, 9);
            g.fillStyle(0xffffff, 0.2);
            g.fillCircle(CARD_W / 2, 40, 4);
        }

        // --- Dark card textures ---
        drawCardFace(g, THEMES.dark.cardMonsterBg, THEMES.dark.cardMonsterBorder);
        drawMonsterIcon(); g.generateTexture('card_monster_d', CARD_W, CARD_H);

        drawCardFace(g, THEMES.dark.cardWeaponBg, THEMES.dark.cardWeaponBorder);
        drawWeaponIcon(); g.generateTexture('card_weapon_d', CARD_W, CARD_H);

        drawCardFace(g, THEMES.dark.cardPotionBg, THEMES.dark.cardPotionBorder);
        drawPotionIcon(); g.generateTexture('card_potion_d', CARD_W, CARD_H);

        // --- Light card textures ---
        drawCardFace(g, THEMES.light.cardMonsterBg, THEMES.light.cardMonsterBorder);
        drawMonsterIcon(); g.generateTexture('card_monster_l', CARD_W, CARD_H);

        drawCardFace(g, THEMES.light.cardWeaponBg, THEMES.light.cardWeaponBorder);
        drawWeaponIcon(); g.generateTexture('card_weapon_l', CARD_W, CARD_H);

        drawCardFace(g, THEMES.light.cardPotionBg, THEMES.light.cardPotionBorder);
        drawPotionIcon(); g.generateTexture('card_potion_l', CARD_W, CARD_H);

        // --- Button texture ---
        g.clear();
        g.fillStyle(COLORS.buttonBg, 1);
        g.fillRoundedRect(0, 0, 194, 46, 11);
        g.lineStyle(2, 0xa080e0, 1);
        g.strokeRoundedRect(0, 0, 194, 46, 11);
        g.generateTexture('btn_pass', 194, 46);

        g.destroy();
    }

    function drawCardFace(g, darkColor, borderColor) {
        g.clear();
        // Card shadow / outer edge
        g.fillStyle(0x000000, 0.3);
        g.fillRoundedRect(3, 3, CARD_W, CARD_H, 14);
        // Main background
        g.fillStyle(darkColor, 1);
        g.fillRoundedRect(0, 0, CARD_W, CARD_H, 14);
        // Inner glow
        g.fillStyle(0xffffff, 0.04);
        g.fillRoundedRect(4, 4, CARD_W - 8, CARD_H - 8, 10);
        // Border
        g.lineStyle(2, borderColor, 0.8);
        g.strokeRoundedRect(0, 0, CARD_W, CARD_H, 14);
        // Top accent line
        g.lineStyle(1, borderColor, 0.3);
        g.lineBetween(20, 68, CARD_W - 20, 68);
        // Bottom accent line
        g.lineBetween(20, CARD_H - 52, CARD_W - 20, CARD_H - 52);
    }

    // ═══════════════════════════════════════════════════════════════
    //  SCENE: CREATE — Build UI & initialize game
    // ═══════════════════════════════════════════════════════════════
    function create() {
        const s = this; // scene reference for closures

        // ── Background ──
        // Subtle grid pattern
        const bgGfx = s.add.graphics();
        s.bgGfx = bgGfx;
        bgGfx.fillStyle(0x1a1a3e, 0.3);
        for (let x = 0; x < CANVAS_W; x += 60) {
            bgGfx.fillRect(x, 0, 1, CANVAS_H);
        }
        for (let y = 0; y < CANVAS_H; y += 60) {
            bgGfx.fillRect(0, y, CANVAS_W, 1);
        }

        // ── Title (top) ──
        const titleText = s.add.text(CANVAS_W / 2, 21, '⚔️ 地牢探险', {
            fontSize: '18px',
            fill: '#f0c040',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        s.titleText = titleText;

        // ── Top divider line ──
        const topLine = s.add.graphics();
        s.topLineGfx = topLine;
        topLine.lineStyle(1, 0x3a3a6a, 0.4);
        topLine.lineBetween(15, 41, CANVAS_W - 15, 41);

        // ── Skip Room Button (top-right) ──
        const skipX = 423;
        const skipY = 21;
        const skipW = 92;
        const skipH = 27;

        const skipBg = s.add.graphics();
        s.skipBg = skipBg;

        const skipText = s.add.text(skipX, skipY, '⏭️ 跳过', {
            fontSize: '11px',
            fill: '#cccce0',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        s.skipText = skipText;

        const skipZone = s.add.zone(skipX, skipY, skipW, skipH)
            .setInteractive({ useHandCursor: true });
        skipZone.on('pointerdown', () => skipRoom(s));
        skipZone.on('pointerover', () => {
            if (gameState.canSkip && !gameState.gameOver && !gameState.gameWon) {
                s.skipText.setScale(1.08);
            }
        });
        skipZone.on('pointerout', () => {
            s.skipText.setScale(1);
        });
        s.skipZone = skipZone;

        // ── Theme Toggle Button (top-left) ──
        s.theme = 'dark';
        const themeX = 57;
        const themeY = 21;
        const themeW = 44;
        const themeH = 27;

        const themeBg = s.add.graphics();
        s.themeBg = themeBg;

        const themeBtnText = s.add.text(themeX, themeY, '🌙', {
            fontSize: '16px'
        }).setOrigin(0.5);
        s.themeBtnText = themeBtnText;

        const themeZone = s.add.zone(themeX, themeY, themeW, themeH)
            .setInteractive({ useHandCursor: true });
        themeZone.on('pointerdown', () => toggleTheme(s));
        s.themeZone = themeZone;

        // ═══════════════════════════════════════════════════
        //  BOTTOM STATS BAR (all player info moved here)
        // ═══════════════════════════════════════════════════
        const statsY = 649;
        const statsH = 74;
        s.statsY = statsY;

        // Stats bar background
        const statsBg = s.add.graphics();
        s.statsBgGfx = statsBg;
        statsBg.fillStyle(COLORS.headerBg, 0.85);
        statsBg.fillRoundedRect(8, statsY, CANVAS_W - 16, statsH, 10);
        statsBg.lineStyle(1, 0x3a3a6a, 0.5);
        statsBg.strokeRoundedRect(8, statsY, CANVAS_W - 16, statsH, 10);

        // ── HP Display (left) ──
        s.add.text(48, statsY + 15, '❤️', {
            fontSize: '14px',
            fill: '#cccce0',
            fontFamily: 'Microsoft YaHei, sans-serif'
        }).setOrigin(0.5);

        const hpText = s.add.text(105, statsY + 32, '', {
            fontSize: '13px',
            fill: '#ffffff',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        s.hpText = hpText;

        // HP bar
        const hpBarBg = s.add.graphics();
        hpBarBg.fillStyle(0x333355, 1);
        hpBarBg.fillRoundedRect(0, 0, 140, 12, 6);
        hpBarBg.x = 44;
        hpBarBg.y = statsY + 48;

        const hpBarFill = s.add.graphics();
        hpBarFill.x = 44;
        hpBarFill.y = statsY + 48;
        s.hpBarFill = hpBarFill;

        // ── Weapon Display (center) ──
        s.add.text(260, statsY + 15, '🗡️ 武器', {
            fontSize: '11px',
            fill: '#cccce0',
            fontFamily: 'Microsoft YaHei, sans-serif'
        }).setOrigin(0.5);

        const weaponText = s.add.text(260, statsY + 32, '无', {
            fontSize: '13px',
            fill: '#8888aa',
            fontFamily: 'Microsoft YaHei, sans-serif'
        }).setOrigin(0.5);
        s.weaponText = weaponText;

        // ── Weapon Toggle Button ──
        const toggleW = 110;
        const toggleH = 21;
        const toggleX = 260;
        const toggleY = statsY + 62;

        const toggleBg = s.add.graphics();
        s.weaponToggleBg = toggleBg;

        const toggleText = s.add.text(toggleX, toggleY, '', {
            fontSize: '10px',
            fill: '#ffffff',
            fontFamily: 'Microsoft YaHei, sans-serif'
        }).setOrigin(0.5);
        s.weaponToggleText = toggleText;

        const toggleZone = s.add.zone(toggleX, toggleY, toggleW, toggleH)
            .setInteractive({ useHandCursor: true });
        toggleZone.on('pointerdown', () => {
            if (gameState.gameOver || gameState.gameWon) return;
            gameState.useWeapon = !gameState.useWeapon;
            updateWeaponToggle(s);
            if (gameState.useWeapon) {
                showMessage(s, '⚔️ 武器已启用');
            } else {
                showMessage(s, '🔒 武器已停用');
            }
        });
        toggleZone.on('pointerover', () => {
            s.tweens.add({ targets: toggleText, scaleX: 1.08, scaleY: 1.08, duration: 80, ease: 'Power2' });
        });
        toggleZone.on('pointerout', () => {
            s.tweens.add({ targets: toggleText, scaleX: 1, scaleY: 1, duration: 80, ease: 'Power2' });
        });
        s.weaponToggleZone = toggleZone;

        // ── Room / Deck Display (right) ──
        const roomDeckText = s.add.text(405, statsY + 20, '', {
            fontSize: '11px',
            fill: '#aaaacc',
            fontFamily: 'Microsoft YaHei, sans-serif',
            align: 'center',
            lineSpacing: 3
        }).setOrigin(0.5, 0);
        s.roomDeckText = roomDeckText;

        // ── Card Slots ──
        // Arrays to hold card display objects
        s.cardBgs = [];
        s.cardTypeLabels = [];
        s.cardValueTexts = [];
        s.cardUnitLabels = [];
        s.cardOverlays = [];
        s.cardStatusTexts = [];
        s.cardContainers = []; // for hover logic

        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            const cx = CARD_X[i];
            const cy = CARD_Y[i];

            // Empty slot indicator (shown when no card)
            const slotGfx = s.add.graphics();
            slotGfx.lineStyle(1, 0x3a3a6a, 0.5);
            slotGfx.strokeRoundedRect(cx - CARD_W / 2, cy - CARD_H / 2, CARD_W, CARD_H, 14);
            slotGfx.setVisible(false);
            if (!s.slotGfxs) s.slotGfxs = [];
            s.slotGfxs.push(slotGfx);

            // Card background image
            const bg = s.add.image(cx, cy, 'card_monster_d');
            bg.setVisible(false);
            bg.setInteractive({ useHandCursor: true });
            s.cardBgs.push(bg);

            // Type label (top of card)
            const typeLabel = s.add.text(cx, cy - 74, '', {
                fontSize: '10px',
                fill: '#ccccee',
                fontFamily: 'Microsoft YaHei, sans-serif',
            }).setOrigin(0.5).setVisible(false);
            s.cardTypeLabels.push(typeLabel);

            // Value (center, large)
            const valueText = s.add.text(cx, cy + 4, '', {
                fontSize: '36px',
                fill: '#ffffff',
                fontFamily: 'Georgia, serif',
                fontStyle: 'bold'
            }).setOrigin(0.5).setVisible(false);
            s.cardValueTexts.push(valueText);

            // Unit label
            const unitLabel = s.add.text(cx, cy + 42, '', {
                fontSize: '12px',
                fill: '#aaaacc',
                fontFamily: 'Microsoft YaHei, sans-serif',
            }).setOrigin(0.5).setVisible(false);
            s.cardUnitLabels.push(unitLabel);

            // Dark overlay (for processed cards)
            const overlay = s.add.rectangle(cx, cy, CARD_W - 6, CARD_H - 6, COLORS.overlay, 0.55)
                .setVisible(false);
            s.cardOverlays.push(overlay);

            // Status text (DEFEATED / USED / EQUIPPED)
            const statusText = s.add.text(cx, cy + 68, '', {
                fontSize: '12px',
                fill: '#ff8888',
                fontFamily: 'Microsoft YaHei, sans-serif',
                fontStyle: 'bold'
            }).setOrigin(0.5).setVisible(false);
            s.cardStatusTexts.push(statusText);

            // Click handler
            bg.on('pointerdown', () => onCardClick(s, i));
            bg.on('pointerover', () => onCardHover(s, i, true));
            bg.on('pointerout', () => onCardHover(s, i, false));
        }

        // ── Monster Action Button (shared, hidden initially) ──
        s.selectedCardIndex = -1;

        const actionBtnW = 152;
        const actionBtnH = 34;
        const actionBtnBg = s.add.graphics().setVisible(false).setDepth(5);
        s.actionBtnBg = actionBtnBg;

        const actionBtnText = s.add.text(0, 0, '', {
            fontSize: '14px',
            fill: '#ffffff',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5).setVisible(false).setDepth(6);
        s.actionBtnText = actionBtnText;

        const actionBtnZone = s.add.zone(0, 0, actionBtnW, actionBtnH)
            .setDepth(7).setInteractive({ useHandCursor: true }).setVisible(false);
        actionBtnZone.on('pointerdown', () => {
            if (s.selectedCardIndex >= 0) {
                const card = gameState.roomCards[s.selectedCardIndex];
                if (!card) return;
                switch (card.type) {
                    case 'monster': fightMonster(s, s.selectedCardIndex); break;
                    case 'weapon':  equipWeapon(s, s.selectedCardIndex); break;
                    case 'potion':  usePotion(s, s.selectedCardIndex); break;
                }
            }
        });
        actionBtnZone.on('pointerover', () => {
            s.actionBtnText.setScale(1.06);
        });
        actionBtnZone.on('pointerout', () => {
            s.actionBtnText.setScale(1);
        });
        s.actionBtnZone = actionBtnZone;

        // ── Message Area ──
        const msgBg = s.add.graphics();
        s.msgBgGfx = msgBg;
        msgBg.fillStyle(COLORS.headerBg, 0.6);
        msgBg.fillRoundedRect(15, 569, CANVAS_W - 30, 64, 9);
        msgBg.lineStyle(1, 0x3a3a6a, 0.3);
        msgBg.strokeRoundedRect(15, 569, CANVAS_W - 30, 64, 9);

        const messageText = s.add.text(CANVAS_W / 2, 601, '选择卡牌开始行动吧！\n打怪物、装备武器或使用血瓶', {
            fontSize: '13px',
            fill: '#aaaacc',
            fontFamily: 'Microsoft YaHei, sans-serif',
            align: 'center',
            lineSpacing: 3
        }).setOrigin(0.5);
        s.messageText = messageText;

        // ── Next Room Button ──
        const btnContainer = s.add.container(CANVAS_W / 2, 745);
        const btnBg = s.add.image(0, 0, 'btn_pass');
        const btnText = s.add.text(0, 0, '▶ 进入下一房间', {
            fontSize: '14px',
            fill: '#ffffff',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        btnContainer.add([btnBg, btnText]);
        btnContainer.setSize(194, 46);
        btnContainer.setInteractive({ useHandCursor: true });
        btnContainer.setVisible(false);
        btnContainer.setAlpha(0);

        btnContainer.on('pointerdown', () => passRoom(s));
        btnContainer.on('pointerover', () => {
            btnBg.setTint(COLORS.buttonHover);
            btnContainer.setScale(1.04);
        });
        btnContainer.on('pointerout', () => {
            btnBg.clearTint();
            btnContainer.setScale(1);
        });
        s.nextRoomBtn = btnContainer;
        s.nextRoomBtnBg = btnBg;

        // ── Game Over / Victory Overlay (hidden initially) ──
        const endOverlay = s.add.graphics();
        endOverlay.fillStyle(0x000000, 0.75);
        endOverlay.fillRect(0, 0, CANVAS_W, CANVAS_H);
        endOverlay.setVisible(false);
        endOverlay.setDepth(100);
        s.endOverlay = endOverlay;

        const endTitle = s.add.text(CANVAS_W / 2, 286, '', {
            fontSize: '44px',
            fill: '#ffffff',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5).setDepth(101).setVisible(false);
        s.endTitle = endTitle;

        const endSubtitle = s.add.text(CANVAS_W / 2, 366, '', {
            fontSize: '16px',
            fill: '#cccce0',
            fontFamily: 'Microsoft YaHei, sans-serif',
            align: 'center'
        }).setOrigin(0.5).setDepth(101).setVisible(false);
        s.endSubtitle = endSubtitle;

        const restartBtnBg = s.add.graphics();
        restartBtnBg.fillStyle(COLORS.buttonBg, 1);
        restartBtnBg.fillRoundedRect(CANVAS_W / 2 - 103, 423, 206, 50, 13);
        restartBtnBg.lineStyle(2, 0xa080e0, 1);
        restartBtnBg.strokeRoundedRect(CANVAS_W / 2 - 103, 423, 206, 50, 13);
        restartBtnBg.setDepth(101).setVisible(false);
        s.restartBtnBg = restartBtnBg;

        const restartText = s.add.text(CANVAS_W / 2, 448, '🔄 再来一局', {
            fontSize: '16px',
            fill: '#ffffff',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5).setDepth(101).setVisible(false);
        s.restartText = restartText;

        // Restart hit zone
        const restartZone = s.add.zone(CANVAS_W / 2, 448, 206, 50)
            .setDepth(102).setInteractive({ useHandCursor: true }).setVisible(false);
        restartZone.on('pointerdown', () => restartGame(s));
        restartZone.on('pointerover', () => {
            restartBtnBg.clear();
            restartBtnBg.fillStyle(COLORS.buttonHover, 1);
            restartBtnBg.fillRoundedRect(CANVAS_W / 2 - 103, 423, 206, 50, 13);
            restartBtnBg.lineStyle(2, 0xa080e0, 1);
            restartBtnBg.strokeRoundedRect(CANVAS_W / 2 - 103, 423, 206, 50, 13);
        });
        restartZone.on('pointerout', () => {
            restartBtnBg.clear();
            restartBtnBg.fillStyle(COLORS.buttonBg, 1);
            restartBtnBg.fillRoundedRect(CANVAS_W / 2 - 103, 423, 206, 50, 13);
            restartBtnBg.lineStyle(2, 0xa080e0, 1);
            restartBtnBg.strokeRoundedRect(CANVAS_W / 2 - 103, 423, 206, 50, 13);
        });
        s.restartZone = restartZone;

        // ── Initialize Game ──
        gameState = resetGameState();
        gameState.deck = generateDeck();
        drawRoom(s);
        renderCards(s);
        updateUI(s);

        // Welcome animation
        showMessage(s, '⚔️ 欢迎来到地牢！共有 ' + DECK_TOTAL + ' 张牌，' +
            Math.floor(DECK_TOTAL / CARDS_PER_ROOM) + ' 个房间\n选择卡牌开始你的冒险吧！');
    }

    // ═══════════════════════════════════════════════════════════════
    //  CARD RENDERING
    // ═══════════════════════════════════════════════════════════════
    function renderCards(s) {
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            const card = gameState.roomCards[i];
            const bg = s.cardBgs[i];
            const typeLabel = s.cardTypeLabels[i];
            const valueText = s.cardValueTexts[i];
            const unitLabel = s.cardUnitLabels[i];
            const processed = gameState.roomProcessed[i];

            if (!card) {
                // No card in this slot
                bg.setVisible(false);
                typeLabel.setVisible(false);
                valueText.setVisible(false);
                unitLabel.setVisible(false);
                s.cardOverlays[i].setVisible(false);
                s.cardStatusTexts[i].setVisible(false);
                if (s.slotGfxs[i]) s.slotGfxs[i].setVisible(false);
                continue;
            }

            // Set texture
            const suffix = s.theme === 'dark' ? '_d' : '_l';
            const texKey = (card.type === 'monster' ? 'card_monster' :
                            card.type === 'weapon' ? 'card_weapon' : 'card_potion') + suffix;
            bg.setTexture(texKey);
            bg.setVisible(true);

            // Theme-aware text colors
            const t = THEMES[s.theme];
            const txtLight = '#' + t.textLight.toString(16).padStart(6, '0');
            const txtDim = '#' + t.textDim.toString(16).padStart(6, '0');

            // Type label
            const typeStr = card.type === 'monster' ? '👹 怪物' :
                            card.type === 'weapon' ? '⚔️ 武器' : '🧪 血瓶';
            typeLabel.setText(typeStr).setVisible(true).setAlpha(1).setFill(txtDim);

            // Value
            const val = card.type === 'monster' ? card.hp :
                        card.type === 'weapon' ? card.atk : card.heal;
            valueText.setText(String(val)).setVisible(true).setAlpha(1).setFill(txtLight);

            // Unit label
            const unitStr = card.type === 'monster' ? 'HP' :
                            card.type === 'weapon' ? 'ATK' : '恢复';
            unitLabel.setText(unitStr).setVisible(true).setAlpha(1).setFill(txtDim);

            // Processed state
            if (processed) {
                bg.setTint(0x555555);
                s.cardOverlays[i].setVisible(true).setAlpha(1);
                const statusStr = card.type === 'monster' ? '☠️ 已击败' :
                                  card.type === 'weapon' ? '✅ 已装备' : '✅ 已使用';
                s.cardStatusTexts[i].setText(statusStr).setVisible(true).setAlpha(1).setFill('#ff8888');
                bg.disableInteractive();
            } else {
                bg.clearTint();
                bg.setAlpha(1);
                s.cardOverlays[i].setVisible(false).setAlpha(1);
                s.cardStatusTexts[i].setVisible(false).setAlpha(1);
                if (!gameState.gameOver && !gameState.gameWon) {
                    bg.setInteractive({ useHandCursor: true });
                }
            }

            if (s.slotGfxs[i]) s.slotGfxs[i].setVisible(false);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  THEME
    // ═══════════════════════════════════════════════════════════════
    function toggleTheme(s) {
        s.theme = (s.theme === 'dark') ? 'light' : 'dark';
        applyTheme(s);
        renderCards(s);
        updateUI(s);
    }

    function applyTheme(s) {
        const t = THEMES[s.theme];
        const isDark = s.theme === 'dark';

        // Canvas background
        s.cameras.main.setBackgroundColor(t.bg);

        // Grid pattern
        s.bgGfx.clear();
        s.bgGfx.fillStyle(t.gridColor, t.gridAlpha);
        for (let x = 0; x < CANVAS_W; x += 60) {
            s.bgGfx.fillRect(x, 0, 1, CANVAS_H);
        }
        for (let y = 0; y < CANVAS_H; y += 60) {
            s.bgGfx.fillRect(0, y, CANVAS_W, 1);
        }

        // Stats bar
        s.statsBgGfx.clear();
        s.statsBgGfx.fillStyle(t.headerBg, 0.85);
        s.statsBgGfx.fillRoundedRect(8, s.statsY, CANVAS_W - 16, 74, 10);
        s.statsBgGfx.lineStyle(1, t.divider, 0.5);
        s.statsBgGfx.strokeRoundedRect(8, s.statsY, CANVAS_W - 16, 74, 10);

        // Message background
        s.msgBgGfx.clear();
        s.msgBgGfx.fillStyle(t.headerBg, 0.6);
        s.msgBgGfx.fillRoundedRect(15, 569, CANVAS_W - 30, 64, 9);
        s.msgBgGfx.lineStyle(1, t.divider, 0.3);
        s.msgBgGfx.strokeRoundedRect(15, 569, CANVAS_W - 30, 64, 9);

        // Top divider
        s.topLineGfx.clear();
        s.topLineGfx.lineStyle(1, t.divider, 0.4);
        s.topLineGfx.lineBetween(15, 41, CANVAS_W - 15, 41);

        // Update known UI text colors
        const txtLight = '#' + t.textLight.toString(16).padStart(6, '0');
        const txtDim = '#' + t.textDim.toString(16).padStart(6, '0');
        const txtAccent = '#' + t.accent.toString(16).padStart(6, '0');

        if (s.titleText) s.titleText.setFill(txtAccent);
        if (s.hpText) s.hpText.setFill(txtLight);
        if (s.weaponText) s.weaponText.setFill(gameState.weapon ? txtAccent : txtDim);
        if (s.messageText) s.messageText.setFill(txtDim);
        if (s.roomDeckText) s.roomDeckText.setFill(txtDim);
        if (s.skipText) s.skipText.setFill(isDark ? '#cccce0' : '#555566');

        // Theme button
        s.themeBtnText.setText(isDark ? '🌙' : '☀️');
        s.themeBg.clear();
        s.themeBg.fillStyle(t.headerBg, 0.8);
        s.themeBg.fillRoundedRect(57 - 22, 21 - 14, 44, 27, 7);

        // Button tint for next room
        if (s.nextRoomBtnBg) {
            s.nextRoomBtnBg.setTint(isDark ? 0xffffff : 0xcccccc);
        }

        showMessage(s, isDark ? '🌙 已切换至暗色主题' : '☀️ 已切换至亮色主题');
    }
    // ═══════════════════════════════════════════════════════════════
    function updateWeaponToggle(s) {
        const toggleBg = s.weaponToggleBg;
        const toggleText = s.weaponToggleText;
        const toggleZone = s.weaponToggleZone;
        const toggleX = 260;
        const toggleY = s.statsY + 62;
        const toggleW = 110;
        const toggleH = 21;

        if (!gameState.weapon || gameState.gameOver || gameState.gameWon) {
            // No weapon — hide toggle
            toggleBg.clear();
            toggleText.setText('').setVisible(false);
            toggleZone.setVisible(false);
            return;
        }

        toggleText.setVisible(true);
        toggleZone.setVisible(true);

        const isOn = gameState.useWeapon;
        toggleBg.clear();

        if (isOn) {
            // Green — weapon enabled
            toggleBg.fillStyle(0x1a5a2a, 0.9);
            toggleBg.fillRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleBg.lineStyle(1, 0x2ecc71, 0.7);
            toggleBg.strokeRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleText.setText('⚔️ 使用武器').setFill('#4eff8e');
        } else {
            // Gray — weapon disabled (lighter in light theme)
            toggleBg.fillStyle(s.theme === 'dark' ? 0x3a3a3a : 0xd8d8d8, 0.8);
            toggleBg.fillRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleBg.lineStyle(1, s.theme === 'dark' ? 0x666666 : 0xaaaaaa, 0.5);
            toggleBg.strokeRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleText.setText('🔒 不用武器').setFill(s.theme === 'dark' ? '#aaaaaa' : '#666666');
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  UI UPDATE
    // ═══════════════════════════════════════════════════════════════
    function updateUI(s) {
        // HP
        s.hpText.setText(gameState.playerHP + ' / ' + gameState.maxHP);
        const hpColor = gameState.playerHP > 12 ? COLORS.hpGreen :
                        gameState.playerHP > 5  ? COLORS.hpYellow : COLORS.hpRed;
        s.hpText.setFill('#' + hpColor.toString(16).padStart(6, '0'));
        // Also update the ❤️ label and message/roomdeck text for theme consistency
        s.messageText.setFill('#' + THEMES[s.theme].textDim.toString(16).padStart(6, '0'));
        s.roomDeckText.setFill('#' + THEMES[s.theme].textDim.toString(16).padStart(6, '0'));

        // HP bar
        const hpRatio = Math.max(0, gameState.playerHP / gameState.maxHP);
        const barColor = hpRatio > 0.6 ? COLORS.hpGreen :
                         hpRatio > 0.25 ? COLORS.hpYellow : COLORS.hpRed;
        const barW = Math.max(0, Math.floor(140 * hpRatio));
        s.hpBarFill.clear();
        if (barW > 0) {
            s.hpBarFill.fillStyle(barColor, 0.9);
            s.hpBarFill.fillRoundedRect(0, 0, barW, 12, 6);
            // Highlight
            s.hpBarFill.fillStyle(0xffffff, 0.15);
            s.hpBarFill.fillRoundedRect(0, 0, barW, 6, { tl: 6, tr: 6, bl: 0, br: 0 });
        }

        // Weapon
        const t = THEMES[s.theme];
        if (gameState.weapon) {
            const lvlStr = gameState.weapon.level === Infinity ? '∞' : gameState.weapon.level;
            s.weaponText.setText('ATK:' + gameState.weapon.atk + '  LV:' + lvlStr);
            s.weaponText.setFill('#' + t.accent.toString(16).padStart(6, '0'));
        } else {
            s.weaponText.setText('无');
            s.weaponText.setFill('#' + t.textDim.toString(16).padStart(6, '0'));
        }
        updateWeaponToggle(s);
        updateSkipButton(s);

        // Room / Deck
        const roomsTotal = Math.ceil(DECK_TOTAL / CARDS_PER_ROOM);
        s.roomDeckText.setText(
            '🏠 房间: ' + gameState.roomNumber + ' / ' + roomsTotal + '\n🃏 剩余: ' + gameState.deck.length + ' 张'
        );

        // Next Room button
        const canPass = gameState.processedCount >= MIN_CARDS_TO_PASS ||
            (gameState.roomCards.filter(Boolean).length < MIN_CARDS_TO_PASS &&
             gameState.processedCount >= gameState.roomCards.filter(Boolean).length);

        if (canPass && !gameState.gameOver && !gameState.gameWon) {
            s.nextRoomBtn.setVisible(true);
            s.tweens.add({
                targets: s.nextRoomBtn,
                alpha: 1,
                duration: 300,
                ease: 'Power2'
            });
        } else {
            s.tweens.add({
                targets: s.nextRoomBtn,
                alpha: 0,
                duration: 200,
                onComplete: () => { if (!canPass || gameState.gameOver || gameState.gameWon) s.nextRoomBtn.setVisible(false); }
            });
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  CARD CLICK HANDLER
    // ═══════════════════════════════════════════════════════════════
    function onCardClick(s, index) {
        if (gameState.gameOver || gameState.gameWon) return;
        if (gameState.roomProcessed[index]) return;

        const card = gameState.roomCards[index];
        if (!card) return;

        // Brief click feedback flash
        s.tweens.add({
            targets: s.cardBgs[index],
            scaleX: 0.95,
            scaleY: 0.95,
            duration: 80,
            yoyo: true,
            ease: 'Power2'
        });

        switch (card.type) {
            case 'monster':
            case 'weapon':
            case 'potion':
                if (s.selectedCardIndex === index) {
                    // Clicking the already-selected card → deselect
                    deselectCard(s);
                } else {
                    // Deselect any previous selection, then select this card
                    if (s.selectedCardIndex >= 0) deselectCard(s);
                    selectCard(s, index);
                }
                break;
        }
    }

    function onCardHover(s, index, entering) {
        if (gameState.gameOver || gameState.gameWon) return;
        if (gameState.roomProcessed[index]) return;
        if (!gameState.roomCards[index]) return;

        if (entering) {
            s.tweens.add({
                targets: s.cardBgs[index],
                scaleX: 1.04,
                scaleY: 1.04,
                duration: 120,
                ease: 'Power2'
            });
        } else {
            s.tweens.add({
                targets: s.cardBgs[index],
                scaleX: 1,
                scaleY: 1,
                duration: 120,
                ease: 'Power2'
            });
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  MONSTER SELECTION & COMBAT PREVIEW
    // ═══════════════════════════════════════════════════════════════
    function getCombatPreview(monster) {
        // Returns info about what would happen if the player fights this monster
        const canUseWeapon = gameState.weapon && gameState.useWeapon && gameState.weapon.level >= monster.hp;
        if (canUseWeapon) {
            const remainingHP = monster.hp - gameState.weapon.atk;
            if (remainingHP <= 0) {
                return { instantKill: true, damageToPlayer: 0 };
            } else {
                return { instantKill: false, damageToPlayer: remainingHP };
            }
        }
        return { instantKill: false, damageToPlayer: monster.hp };
    }

    function selectCard(s, index) {
        s.selectedCardIndex = index;
        const cx = CARD_X[index];
        const cy = CARD_Y[index];
        const card = gameState.roomCards[index];

        // Move card up (absolute targets)
        const offsets = [0, -74, 4, 42, 0, 68]; // bg, typeLabel, valueText, unitLabel, overlay, statusText
        const cardObjs = [
            s.cardBgs[index],
            s.cardTypeLabels[index],
            s.cardValueTexts[index],
            s.cardUnitLabels[index],
            s.cardOverlays[index],
            s.cardStatusTexts[index]
        ];
        cardObjs.forEach((obj, i) => {
            const restY = cy + offsets[i];
            s.tweens.add({ targets: obj, y: restY - 35, duration: 200, ease: 'Back.easeOut' });
        });

        const btnW = 152;
        const btnH = 34;
        const btnY = cy + 102;

        // Compute & show action button (type-specific)
        const btnX = cx;

        s.actionBtnBg.clear();
        s.actionBtnBg.setPosition(btnX - btnW / 2, btnY - btnH / 2);

        if (card.type === 'monster') {
            const preview = getCombatPreview(card);
            if (preview.instantKill) {
                s.actionBtnBg.fillStyle(0x2a6a1a, 0.95);
                s.actionBtnBg.fillRoundedRect(0, 0, btnW, btnH, 8);
                s.actionBtnBg.lineStyle(2, 0x4ecc2e, 0.9);
                s.actionBtnBg.strokeRoundedRect(0, 0, btnW, btnH, 8);
                s.actionBtnText.setText('⚡ 斩杀').setFill('#6eff4e');
            } else {
                s.actionBtnBg.fillStyle(0x6a2020, 0.95);
                s.actionBtnBg.fillRoundedRect(0, 0, btnW, btnH, 8);
                s.actionBtnBg.lineStyle(2, 0xcc3333, 0.9);
                s.actionBtnBg.strokeRoundedRect(0, 0, btnW, btnH, 8);
                s.actionBtnText.setText('⚔️ 击杀(消耗' + preview.damageToPlayer + '点生命)').setFill('#ff6666');
            }
            showMessage(s, '选择战斗方式 — 点击下方按钮确认攻击');
        } else if (card.type === 'weapon') {
            const oldAtk = gameState.weapon ? gameState.weapon.atk : null;
            s.actionBtnBg.fillStyle(0x123a54, 0.95);
            s.actionBtnBg.fillRoundedRect(0, 0, btnW, btnH, 8);
            s.actionBtnBg.lineStyle(2, 0x3498db, 0.9);
            s.actionBtnBg.strokeRoundedRect(0, 0, btnW, btnH, 8);
            if (oldAtk !== null) {
                s.actionBtnText.setText('🔄 替换(ATK ' + oldAtk + ' → ' + card.atk + ')').setFill('#6eb8f0');
                showMessage(s, '新武器 ATK ' + card.atk + '，将替换当前武器（ATK ' + oldAtk + '）');
            } else {
                s.actionBtnText.setText('🗡️ 装备').setFill('#6eb8f0');
                showMessage(s, '装备武器 ATK ' + card.atk + ' — 点击按钮确认');
            }
        } else if (card.type === 'potion') {
            const actualHeal = Math.min(card.heal, gameState.maxHP - gameState.playerHP);
            s.actionBtnBg.fillStyle(0x0f4224, 0.95);
            s.actionBtnBg.fillRoundedRect(0, 0, btnW, btnH, 8);
            s.actionBtnBg.lineStyle(2, 0x2ecc71, 0.9);
            s.actionBtnBg.strokeRoundedRect(0, 0, btnW, btnH, 8);
            if (actualHeal <= 0) {
                s.actionBtnText.setText('🧪 已达上限(HP已满)').setFill('#88cc88');
                showMessage(s, '生命值已满，使用血瓶没有效果');
            } else {
                s.actionBtnText.setText('🧪 使用(恢复' + actualHeal + '点生命)').setFill('#6eff8e');
                showMessage(s, '使用血瓶恢复 ' + actualHeal + ' 点生命 — 点击按钮确认');
            }
        }

        s.actionBtnBg.setVisible(true);

        // Position and show text + zone
        s.actionBtnText.setPosition(btnX, btnY).setVisible(true);
        s.actionBtnZone.setPosition(btnX, btnY).setVisible(true);
    }

    function deselectCard(s) {
        if (s.selectedCardIndex < 0) return;
        const index = s.selectedCardIndex;
        s.selectedCardIndex = -1;

        const cy = CARD_Y[index];
        const offsets = [0, -74, 4, 42, 0, 68];
        const cardObjs = [
            s.cardBgs[index],
            s.cardTypeLabels[index],
            s.cardValueTexts[index],
            s.cardUnitLabels[index],
            s.cardOverlays[index],
            s.cardStatusTexts[index]
        ];
        cardObjs.forEach((obj, i) => {
            const restY = cy + offsets[i];
            s.tweens.add({ targets: obj, y: restY, duration: 180, ease: 'Back.easeIn' });
        });

        // Hide action button
        s.actionBtnBg.setVisible(false);
        s.actionBtnText.setVisible(false);
        s.actionBtnZone.setVisible(false);
    }

    // ═══════════════════════════════════════════════════════════════
    //  COMBAT
    // ═══════════════════════════════════════════════════════════════
    function fightMonster(s, index) {
        const monster = gameState.roomCards[index];
        const originalHP = monster.hp;
        let damageToPlayer;
        let weaponUsed = false;

        // Check if weapon can be used (must be equipped, enabled, and pass level check)
        const canUseWeapon = gameState.weapon && gameState.useWeapon && gameState.weapon.level >= monster.hp;

        if (canUseWeapon) {
            weaponUsed = true;
            const remainingHP = monster.hp - gameState.weapon.atk;
            if (remainingHP <= 0) {
                // Instant kill!
                damageToPlayer = 0;
                showMessage(s, '⚡ 武器攻击！ATK ' + gameState.weapon.atk +
                    ' vs 怪物 HP ' + originalHP + ' → 秒杀！\n无伤击败怪物！（武器等级降为 ' + originalHP + '）');
            } else {
                // Weapon reduces HP, player takes rest
                damageToPlayer = remainingHP;
                showMessage(s, '⚔️ 武器攻击削减 ' + gameState.weapon.atk + ' 点HP\n' +
                    '怪物剩余 HP ' + remainingHP + '，你受到 ' + remainingHP + ' 点伤害（武器等级降为 ' + originalHP + '）');
            }
            // Update weapon level
            gameState.weapon.level = originalHP;
        } else {
            // No weapon, weapon disabled, or level check failed
            damageToPlayer = monster.hp;
            if (gameState.weapon && !gameState.useWeapon) {
                // Player has weapon but chose not to use it
                showMessage(s, '🔒 武器已手动停用！徒手战斗\n' +
                    '击败怪物（HP ' + monster.hp + '），受到 ' + damageToPlayer + ' 点伤害！（武器等级保持不变）');
            } else if (gameState.weapon) {
                // Level check failed
                showMessage(s, '🔒 武器等级不足！（LV ' +
                    (gameState.weapon.level === Infinity ? '∞' : gameState.weapon.level) +
                    ' < 怪物 HP ' + monster.hp + '）\n徒手战斗，受到 ' + damageToPlayer + ' 点伤害！');
            } else {
                // No weapon at all
                showMessage(s, '👊 徒手战斗！\n击败怪物（HP ' + monster.hp + '），受到 ' + damageToPlayer + ' 点伤害！');
            }
            weaponUsed = false;
        }

        // Apply damage
        gameState.playerHP = Math.max(0, gameState.playerHP - damageToPlayer);

        // Mark defeated
        gameState.roomProcessed[index] = true;
        gameState.processedCount++;

        // Deselect card and hide action button
        deselectCard(s);

        // Screen shake for impact
        if (damageToPlayer > 0) {
            s.cameras.main.shake(200, 0.005 * damageToPlayer);
            // Red flash
            s.cameras.main.flash(150, 255, 0, 0);
        } else if (weaponUsed) {
            // Gold flash for instant kill
            s.cameras.main.flash(150, 255, 200, 0);
        }

        renderCards(s);
        updateUI(s);

        // Check game over
        if (gameState.playerHP <= 0) {
            s.time.delayedCall(600, () => triggerGameOver(s));
        } else {
            // Auto-check if all monsters in room are defeated
            checkAutoPass(s);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  EQUIP WEAPON
    // ═══════════════════════════════════════════════════════════════
    function equipWeapon(s, index) {
        const weaponCard = gameState.roomCards[index];
        const oldWeapon = gameState.weapon;

        gameState.weapon = {
            atk: weaponCard.atk,
            level: Infinity // fresh weapon, infinite level
        };

        gameState.roomProcessed[index] = true;
        gameState.processedCount++;

        // Deselect and hide action button
        deselectCard(s);

        if (oldWeapon) {
            showMessage(s, '🔄 替换武器！旧武器（ATK ' + oldWeapon.atk + '）已丢弃\n' +
                '新武器 ATK ' + weaponCard.atk + '，等级 ∞（首次击杀后变为怪物HP值）');
        } else {
            showMessage(s, '🗡️ 装备武器！ATK ' + weaponCard.atk +
                '\n等级 ∞ — 首次击杀怪物后等级将变为该怪物的HP值');
        }

        renderCards(s);
        updateUI(s);
        checkAutoPass(s);
    }

    // ═══════════════════════════════════════════════════════════════
    //  USE POTION
    // ═══════════════════════════════════════════════════════════════
    function usePotion(s, index) {
        const potionCard = gameState.roomCards[index];
        const healAmount = potionCard.heal;
        const oldHP = gameState.playerHP;
        const actualHeal = Math.min(healAmount, gameState.maxHP - gameState.playerHP);

        gameState.playerHP = Math.min(gameState.maxHP, gameState.playerHP + healAmount);
        gameState.roomProcessed[index] = true;
        gameState.processedCount++;

        // Deselect and hide action button
        deselectCard(s);

        if (actualHeal < healAmount) {
            showMessage(s, '🧪 使用血瓶！恢复 ' + actualHeal + ' 点生命（已达上限）\n' +
                'HP: ' + oldHP + ' → ' + gameState.playerHP);
        } else if (actualHeal === 0) {
            showMessage(s, '🧪 使用血瓶！但生命值已满，没有效果');
        } else {
            showMessage(s, '🧪 使用血瓶！恢复 ' + actualHeal + ' 点生命\n' +
                'HP: ' + oldHP + ' → ' + gameState.playerHP);
        }

        // Green flash for healing
        if (actualHeal > 0) {
            s.cameras.main.flash(150, 0, 255, 100);
        }

        renderCards(s);
        updateUI(s);
        checkAutoPass(s);
    }

    // ═══════════════════════════════════════════════════════════════
    //  ROOM MANAGEMENT
    // ═══════════════════════════════════════════════════════════════
    function drawRoom(s) {
        gameState.roomCards = [];
        gameState.roomProcessed = [];
        gameState.processedCount = 0;

        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            if (gameState.deck.length > 0) {
                gameState.roomCards.push(gameState.deck.shift());
                gameState.roomProcessed.push(false);
            } else {
                gameState.roomCards.push(null);
                gameState.roomProcessed.push(true); // mark empty slots as "processed"
            }
        }
    }

    function passRoom(s) {
        if (gameState.gameOver || gameState.gameWon) return;

        // Deselect any selected card
        deselectCard(s);

        // Check if deck is empty — if so, player wins!
        if (gameState.deck.length === 0) {
            triggerVictory(s);
            return;
        }

        gameState.roomNumber++;
        gameState.canSkip = true; // re-enable skip after normal room pass

        // Fade out old cards
        const fadeTargets = [];
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            fadeTargets.push(s.cardBgs[i]);
            fadeTargets.push(s.cardTypeLabels[i]);
            fadeTargets.push(s.cardValueTexts[i]);
            fadeTargets.push(s.cardUnitLabels[i]);
            fadeTargets.push(s.cardOverlays[i]);
            fadeTargets.push(s.cardStatusTexts[i]);
        }

        s.tweens.add({
            targets: fadeTargets,
            alpha: 0,
            duration: 250,
            ease: 'Power2',
            onComplete: () => {
                // Draw new room
                drawRoom(s);
                renderCards(s);

                // Fade in new cards
                const fadeIn = [];
                for (let i = 0; i < CARDS_PER_ROOM; i++) {
                    if (gameState.roomCards[i]) {
                        fadeIn.push(s.cardBgs[i]);
                        fadeIn.push(s.cardTypeLabels[i]);
                        fadeIn.push(s.cardValueTexts[i]);
                        fadeIn.push(s.cardUnitLabels[i]);
                    }
                }
                // Reset alpha and fade in
                fadeIn.forEach(obj => obj.setAlpha(0));
                s.tweens.add({
                    targets: fadeIn,
                    alpha: 1,
                    duration: 300,
                    ease: 'Power2'
                });

                updateUI(s);
                showMessage(s, '🚪 进入房间 ' + gameState.roomNumber +
                    ' | 剩余牌堆: ' + gameState.deck.length + ' 张');
            }
        });
    }

    function skipRoom(s) {
        if (!gameState.canSkip) {
            showMessage(s, '⛔ 不能连续跳过两个房间！需先正常通过一个房间');
            return;
        }
        if (gameState.gameOver || gameState.gameWon) return;

        // Deselect any selected card
        deselectCard(s);

        // Put current room cards at the bottom of the deck
        for (let i = CARDS_PER_ROOM - 1; i >= 0; i--) {
            if (gameState.roomCards[i]) {
                gameState.deck.push(gameState.roomCards[i]);
            }
        }

        // Disable skip for next room
        gameState.canSkip = false;
        gameState.roomNumber++;

        // Fade out old cards
        const fadeTargets = [];
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            fadeTargets.push(s.cardBgs[i]);
            fadeTargets.push(s.cardTypeLabels[i]);
            fadeTargets.push(s.cardValueTexts[i]);
            fadeTargets.push(s.cardUnitLabels[i]);
            fadeTargets.push(s.cardOverlays[i]);
            fadeTargets.push(s.cardStatusTexts[i]);
        }

        s.tweens.add({
            targets: fadeTargets,
            alpha: 0,
            duration: 250,
            ease: 'Power2',
            onComplete: () => {
                drawRoom(s);
                renderCards(s);

                const fadeIn = [];
                for (let i = 0; i < CARDS_PER_ROOM; i++) {
                    if (gameState.roomCards[i]) {
                        fadeIn.push(s.cardBgs[i]);
                        fadeIn.push(s.cardTypeLabels[i]);
                        fadeIn.push(s.cardValueTexts[i]);
                        fadeIn.push(s.cardUnitLabels[i]);
                    }
                }
                fadeIn.forEach(obj => obj.setAlpha(0));
                s.tweens.add({
                    targets: fadeIn,
                    alpha: 1,
                    duration: 300,
                    ease: 'Power2'
                });

                updateUI(s);
                showMessage(s, '⏭️ 跳过房间 ' + (gameState.roomNumber - 1) +
                    ' | 进入房间 ' + gameState.roomNumber +
                    ' | 剩余牌堆: ' + gameState.deck.length + ' 张\n（原房间卡牌已放回牌堆底部）');
            }
        });
    }

    function updateSkipButton(s) {
        const isDark = s.theme === 'dark';
        const canUse = gameState.canSkip && !gameState.gameOver && !gameState.gameWon;
        s.skipBg.clear();
        if (canUse) {
            s.skipBg.fillStyle(isDark ? 0x3a2a5a : 0xb8a8d8, 0.9);
            s.skipBg.fillRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipBg.lineStyle(1, isDark ? 0x8b5cf0 : 0x6040b0, 0.7);
            s.skipBg.strokeRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipText.setFill(isDark ? '#c0b0f0' : '#402880');
            s.skipZone.setInteractive({ useHandCursor: true });
        } else {
            s.skipBg.fillStyle(isDark ? 0x2a2a3a : 0xd0d0d0, 0.6);
            s.skipBg.fillRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipBg.lineStyle(1, isDark ? 0x444466 : 0xaaaaaa, 0.3);
            s.skipBg.strokeRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipText.setFill(isDark ? '#666688' : '#888899');
            s.skipZone.disableInteractive();
        }
    }

    function checkAutoPass(s) {
        // Check if all non-null cards are processed
        const activeCards = gameState.roomCards.filter(c => c !== null).length;
        if (gameState.processedCount >= MIN_CARDS_TO_PASS && activeCards >= MIN_CARDS_TO_PASS) {
            // Notify player they can proceed
            if (gameState.processedCount === activeCards) {
                showMessage(s, '✅ 本房间所有卡牌已处理完毕！点击下方按钮进入下一房间');
            }
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  MESSAGING
    // ═══════════════════════════════════════════════════════════════
    function showMessage(s, text) {
        s.messageText.setText(text);
        // Brief scale pop
        s.tweens.add({
            targets: s.messageText,
            scaleX: 1.03,
            scaleY: 1.03,
            duration: 100,
            yoyo: true,
            ease: 'Power2'
        });
    }

    // ═══════════════════════════════════════════════════════════════
    //  GAME OVER / VICTORY
    // ═══════════════════════════════════════════════════════════════
    function triggerGameOver(s) {
        gameState.gameOver = true;
        renderCards(s);
        updateUI(s);

        s.time.delayedCall(400, () => {
            s.endOverlay.setVisible(true);
            s.endTitle.setText('💀 你死了').setVisible(true);
            s.endSubtitle.setText(
                '你倒在了第 ' + gameState.roomNumber + ' 个房间\n' +
                '击败了无数怪物，但地牢还是吞噬了你...'
            ).setVisible(true);
            s.restartBtnBg.setVisible(true);
            s.restartText.setVisible(true);
            s.restartZone.setVisible(true);

            // Fade in
            s.endTitle.setAlpha(0);
            s.endSubtitle.setAlpha(0);
            s.tweens.add({ targets: s.endTitle, alpha: 1, duration: 600, ease: 'Power2' });
            s.tweens.add({ targets: s.endSubtitle, alpha: 1, duration: 600, delay: 300, ease: 'Power2' });
        });
    }

    function triggerVictory(s) {
        gameState.gameWon = true;
        renderCards(s);
        updateUI(s);

        s.time.delayedCall(400, () => {
            s.endOverlay.setVisible(true);
            s.endTitle.setText('🏆 地牢通关！').setVisible(true);
            s.endSubtitle.setText(
                '恭喜！你成功打通了所有 ' + gameState.roomNumber + ' 个房间\n' +
                '剩余生命: ' + gameState.playerHP + ' / ' + gameState.maxHP
            ).setVisible(true);
            s.restartBtnBg.setVisible(true);
            s.restartText.setVisible(true);
            s.restartZone.setVisible(true);

            s.endTitle.setAlpha(0);
            s.endSubtitle.setAlpha(0);
            s.tweens.add({ targets: s.endTitle, alpha: 1, duration: 600, ease: 'Power2' });
            s.tweens.add({ targets: s.endSubtitle, alpha: 1, duration: 600, delay: 300, ease: 'Power2' });
        });
    }

    function restartGame(s) {
        // Hide overlays
        s.endOverlay.setVisible(false);
        s.endTitle.setVisible(false);
        s.endSubtitle.setVisible(false);
        s.restartBtnBg.setVisible(false);
        s.restartText.setVisible(false);
        s.restartZone.setVisible(false);

        // Reset state
        gameState = resetGameState();
        gameState.deck = generateDeck();
        drawRoom(s);
        renderCards(s);
        updateUI(s);

        // Fade in all card elements
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            if (gameState.roomCards[i]) {
                s.cardBgs[i].setAlpha(1);
                s.cardTypeLabels[i].setAlpha(1);
                s.cardValueTexts[i].setAlpha(1);
                s.cardUnitLabels[i].setAlpha(1);
            }
        }

        showMessage(s, '🔄 新的冒险开始！共有 ' + DECK_TOTAL + ' 张牌\n选择卡牌开始战斗吧！');
    }
    </script>
</body>
</html>
