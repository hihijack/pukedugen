<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>恶棍牌 - 单人卡牌桌游</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0;
        }
        body {
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #game-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(120, 80, 255, 0.35), 0 0 80px rgba(80, 40, 200, 0.15);
            max-width: 100vw;
            max-height: 100dvh;
            max-height: 100vh;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
        }
        #game-container canvas {
            display: block;
            image-rendering: auto;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js">
    </script>
    <script>
    // ═══════════════════════════════════════════════════════════════
    //  CONSTANTS
    // ═══════════════════════════════════════════════════════════════
    const MAX_HP = 20;
    const CARDS_PER_ROOM = 4;
    const MIN_CARDS_TO_PASS = 3;
    const DECK_MONSTERS = 28;
    const DECK_WEAPONS = 10;
    const DECK_POTIONS = 10;
    const DECK_TOTAL = DECK_MONSTERS + DECK_WEAPONS + DECK_POTIONS; // 48
    const CANVAS_W = 480;
    const CANVAS_H = 800;

    const CARD_W = 160;
    const CARD_H = 210;
    // 2×2 grid: index 0=tl, 1=tr, 2=bl, 3=br
    const CARD_X = [133, 347, 133, 347];
    const CARD_Y = [200, 200, 430, 430];

    const COLORS = {
        bg:       0x12122a,
        headerBg: 0x1a1a3e,
        monster:  0xc0392b,
        monsterDark: 0x7b1810,
        monsterLight: 0xe74c3c,
        weapon:   0x2471a3,
        weaponDark: 0x123a54,
        weaponLight: 0x3498db,
        potion:   0x1e8449,
        potionDark: 0x0f4224,
        potionLight: 0x2ecc71,
        hpGreen:  0x2ecc71,
        hpYellow: 0xf39c12,
        hpRed:    0xe74c3c,
        gold:     0xf0c040,
        textLight:0xe8e8f0,
        textDim:  0x8888aa,
        overlay:  0x000000,
        buttonBg: 0x6c3cc0,
        buttonHover: 0x8b5cf0,
        cardSlot: 0x1e1e40,
    };

    const THEMES = {
        dark: {
            bg:         0x12122a,
            headerBg:   0x1a1a3e,
            // Text roles
            textPrimary: 0xf0eee8,  // main body text (warm off-white)
            textSecondary: 0xa8a8c0, // labels, secondary info
            textAccent:  0xf0c040,  // gold highlights (title, weapon name)
            textMuted:   0x7a7a99,  // muted / disabled
            textButton:  0xf8f8ff,  // button labels
            textOverlay: 0xffffff,  // game-over titles
            textStatus:  0xffaa88,  // card status (defeated/equipped/used)
            textWeaponOn:  0x6eff8e, // weapon toggle ON
            textWeaponOff: 0xaaaaaa, // weapon toggle OFF
            textSkipOn:  0xc0b0f0,  // skip button enabled
            textSkipOff: 0x666688,  // skip button disabled
            // Backgrounds / chrome
            gridColor:  0x1a1a3e,
            gridAlpha:  0.3,
            divider:    0x3a3a6a,
            skipBgOn:   0x3a2a5a, skipBorderOn: 0x8b5cf0,
            skipBgOff:  0x2a2a3a, skipBorderOff: 0x444466,
            weaponToggleOffBg: 0x3a3a3a, weaponToggleOffBorder: 0x666666,
            // Card faces
            cardMonsterBg: 0x4a2e2a, cardMonsterBorder: 0x725048,
            cardWeaponBg:  0x123a54, cardWeaponBorder:  0x2471a3,
            cardPotionBg:  0x0f4224, cardPotionBorder:  0x1e8449,
        },
        light: {
            bg:         0xf5f0e8,
            headerBg:   0xe8e2d5,
            // Text roles
            textPrimary: 0x2a2a38,  // dark charcoal
            textSecondary: 0x5a5a70, // medium gray labels
            textAccent:  0xa07000,  // dark amber
            textMuted:   0x8a8a99,  // muted
            textButton:  0x2a2a38,  // button labels (dark on light bg)
            textOverlay: 0xf0eee8,  // game-over titles (light on dark overlay)
            textStatus:  0xcc5544,  // card status
            textWeaponOn:  0xc0ffc0, // weapon toggle ON (light green on dark bg)
            textWeaponOff: 0x444444, // weapon toggle OFF (dark on light bg)
            textSkipOn:  0x402880,  // skip button enabled
            textSkipOff: 0x999999,  // skip button disabled
            // Backgrounds / chrome
            gridColor:  0xd8d0c0,
            gridAlpha:  0.4,
            divider:    0xc8c0b0,
            skipBgOn:   0xb8a8d8, skipBorderOn: 0x6040b0,
            skipBgOff:  0xd8d8d8, skipBorderOff: 0xbbbbbb,
            weaponToggleOffBg: 0xd0d0d0, weaponToggleOffBorder: 0xaaaaaa,
            // Card faces
            cardMonsterBg: 0xe0c8c4, cardMonsterBorder: 0xa03028,
            cardWeaponBg:  0xc8d4e4, cardWeaponBorder:  0x1e6090,
            cardPotionBg:  0xc4e0d0, cardPotionBorder:  0x186838,
        }
    };

    // ═══════════════════════════════════════════════════════════════
    //  GAME STATE
    // ═══════════════════════════════════════════════════════════════
    let gameState;

    function resetGameState() {
        return {
            playerHP: MAX_HP,
            maxHP: MAX_HP,
            weapon: null,           // { atk: number, level: number | Infinity }
            weaponKills: 0,         // kill count for current weapon
            useWeapon: true,        // toggle: use weapon in combat?
            canSkip: true,          // can skip current room? (false after a skip)
            roomInteracted: false,
            currentRoomId: 0,       // room id tied to current 4 cards
            nextRoomId: 1,          // next room id to assign to new cards
            completedRooms: [],     // list of room ids that have been passed
            deck: [],               // remaining cards
            roomCards: [],          // 4 current room cards
            roomProcessed: [],      // boolean[4]
            processedCount: 0,
            gameOver: false,
            gameWon: false,
        };
    }

    // ═══════════════════════════════════════════════════════════════
    //  CARD FACTORY
    // ═══════════════════════════════════════════════════════════════
    function generateDeck() {
        const deck = [];
        // 28 monsters: 2 each of HP 1–14
        for (let hp = 1; hp <= 14; hp++) {
            deck.push({ type: 'monster', hp: hp });
            deck.push({ type: 'monster', hp: hp });
        }
        // 10 weapons: 攻击力 1–10, one each
        for (let atk = 1; atk <= 10; atk++) {
            deck.push({ type: 'weapon', atk: atk });
        }
        // 10 potions: heal 1–10, one each
        for (let heal = 1; heal <= 10; heal++) {
            deck.push({ type: 'potion', heal: heal });
        }
        Phaser.Utils.Array.Shuffle(deck);
        return deck;
    }

    // ═══════════════════════════════════════════════════════════════
    //  DEATH / VICTORY MESSAGES
    // ═══════════════════════════════════════════════════════════════
    const DEATH_MESSAGES = [
        '击败了无数敌人，但邪恶还是吞噬了你...',
        '黑暗淹没了你最后的喘息，冒险到此为止...',
        '你的剑折断了，但你的传说留在了这地牢深处...',
        '一步之遥便是胜利，可惜命运没有眷顾你...',
        '鲜血染红了卡牌，你倒在了冰冷的石板地上...',
        '你闭上了眼睛，耳边回响着怪物的低语...',
        '英雄也会倒下，今天轮到你了...',
        '胜败乃兵家常事，大侠请重新来过...',
    ];

    const VICTORY_MESSAGES = [
        '击败了所有敌人，您的英勇将载入史册！',
        '每一个敌人都倒在你的剑下，和平重临这片大地...',
        '血与火的试炼结束了，你是真正的传奇！',
        '黑暗中最后一声哀嚎消散，你赢得了最终的胜利！',
        '从此以后，酒馆里的吟游诗人将传唱你的名字...',
        '敌人已全部倒下，你是无可争议的冠军！',
        '以勇气为盾，以利刃为笔，你书写了属于自己的史诗！',
        '所有敌人灰飞烟灭，你带着荣耀凯旋而归！',
        '没有敌人能阻挡你的脚步——传说就此诞生！',
        '你踏遍了每一个角落，斩尽了每一个敌人，胜利属于你！',
        '这场战斗结束了，但你的传奇才刚刚开始...',
        '满身伤痕是你荣耀的勋章，恭喜你，勇士！',
    ];

    // ═══════════════════════════════════════════════════════════════
    //  PHASER CONFIG
    // ═══════════════════════════════════════════════════════════════
    const config = {
        type: Phaser.AUTO,
        width: CANVAS_W,
        height: CANVAS_H,
        parent: 'game-container',
        backgroundColor: '#12122a',
        render: {
            antialias: true,
            roundPixels: true,
            powerPreference: 'high-performance'
        },
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
            autoRound: true
        },
        scene: {
            preload: preload,
            create: create
        }
    };

    const game = new Phaser.Game(config);

    // ═══════════════════════════════════════════════════════════════
    //  SCENE: PRELOAD — Generate card textures
    // ═══════════════════════════════════════════════════════════════
    function preload() {
        const g = this.make.graphics({ add: false });

        // --- Dark card textures ---
        drawCardFace(g, THEMES.dark.cardMonsterBg, THEMES.dark.cardMonsterBorder);
        g.generateTexture('card_monster_d', CARD_W, CARD_H);

        drawCardFace(g, THEMES.dark.cardWeaponBg, THEMES.dark.cardWeaponBorder);
        g.generateTexture('card_weapon_d', CARD_W, CARD_H);

        drawCardFace(g, THEMES.dark.cardPotionBg, THEMES.dark.cardPotionBorder);
        g.generateTexture('card_potion_d', CARD_W, CARD_H);

        // --- Light card textures ---
        drawCardFace(g, THEMES.light.cardMonsterBg, THEMES.light.cardMonsterBorder);
        g.generateTexture('card_monster_l', CARD_W, CARD_H);

        drawCardFace(g, THEMES.light.cardWeaponBg, THEMES.light.cardWeaponBorder);
        g.generateTexture('card_weapon_l', CARD_W, CARD_H);

        drawCardFace(g, THEMES.light.cardPotionBg, THEMES.light.cardPotionBorder);
        g.generateTexture('card_potion_l', CARD_W, CARD_H);

        // --- Button textures (dark + light) ---
        g.clear();
        g.fillStyle(COLORS.buttonBg, 1);
        g.fillRoundedRect(0, 0, 194, 46, 11);
        g.lineStyle(2, 0xa080e0, 1);
        g.strokeRoundedRect(0, 0, 194, 46, 11);
        g.generateTexture('btn_pass_d', 194, 46);

        g.clear();
        g.fillStyle(0xd8d0e8, 1);
        g.fillRoundedRect(0, 0, 194, 46, 11);
        g.lineStyle(2, 0x7050b0, 1);
        g.strokeRoundedRect(0, 0, 194, 46, 11);
        g.generateTexture('btn_pass_l', 194, 46);

        g.destroy();
    }

    function drawCardFace(g, darkColor, borderColor) {
        g.clear();
        // Card shadow / outer edge
        g.fillStyle(0x000000, 0.3);
        g.fillRoundedRect(3, 3, CARD_W, CARD_H, 14);
        // Main background
        g.fillStyle(darkColor, 1);
        g.fillRoundedRect(0, 0, CARD_W, CARD_H, 14);
        // Inner glow
        g.fillStyle(0xffffff, 0.04);
        g.fillRoundedRect(4, 4, CARD_W - 8, CARD_H - 8, 10);
        // Border
        g.lineStyle(2, borderColor, 0.8);
        g.strokeRoundedRect(0, 0, CARD_W, CARD_H, 14);
        // Bottom accent line
        g.lineBetween(20, CARD_H - 52, CARD_W - 20, CARD_H - 52);
    }

    // ═══════════════════════════════════════════════════════════════
    //  SCENE: CREATE — Build UI & initialize game
    // ═══════════════════════════════════════════════════════════════
    function create() {
        const s = this; // scene reference for closures

        // ── Background ──
        // Subtle grid pattern
        const bgGfx = s.add.graphics();
        s.bgGfx = bgGfx;
        bgGfx.fillStyle(0x1a1a3e, 0.3);
        for (let x = 0; x < CANVAS_W; x += 60) {
            bgGfx.fillRect(x, 0, 1, CANVAS_H);
        }
        for (let y = 0; y < CANVAS_H; y += 60) {
            bgGfx.fillRect(0, y, CANVAS_W, 1);
        }

        // ── Title (top) ──
        const titleText = s.add.text(CANVAS_W / 2, 21, '🃏 恶棍牌', {
            fontSize: '18px',
            fill: colorToHex(THEMES.dark.textAccent),
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        s.titleText = titleText;

        // ── Top divider line ──
        const topLine = s.add.graphics();
        s.topLineGfx = topLine;
        topLine.lineStyle(1, 0x3a3a6a, 0.4);
        topLine.lineBetween(15, 41, CANVAS_W - 15, 41);

        // ── Skip Room Button (top-right) ──
        const skipX = 423;
        const skipY = 21;
        const skipW = 92;
        const skipH = 27;

        const skipBg = s.add.graphics();
        s.skipBg = skipBg;

        const skipText = s.add.text(skipX, skipY, '⏭️ 跳过', {
            fontSize: '11px',
            fill: colorToHex(THEMES.dark.textSkipOn),
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        s.skipText = skipText;

        const skipZone = s.add.zone(skipX, skipY, skipW, skipH)
            .setInteractive({ useHandCursor: true });
        skipZone.on('pointerdown', () => skipRoom(s));
        skipZone.on('pointerover', () => {
            if (gameState.canSkip && !gameState.gameOver && !gameState.gameWon) {
                s.skipText.setScale(1.08);
            }
        });
        skipZone.on('pointerout', () => {
            s.skipText.setScale(1);
        });
        s.skipZone = skipZone;

        // ── Theme Toggle Button (top-left) ──
        s.theme = 'dark';
        const themeX = 57;
        const themeY = 21;
        const themeW = 44;
        const themeH = 27;

        const themeBg = s.add.graphics();
        s.themeBg = themeBg;

        const themeBtnText = s.add.text(themeX, themeY, '🌙', {
            fontSize: '16px'
        }).setOrigin(0.5);
        s.themeBtnText = themeBtnText;

        const themeZone = s.add.zone(themeX, themeY, themeW, themeH)
            .setInteractive({ useHandCursor: true });
        themeZone.on('pointerdown', () => toggleTheme(s));
        s.themeZone = themeZone;

        // ── Room Progress (above card area, centered) ──
        const roomProgressText = s.add.text(CANVAS_W / 2, 58, '', {
            fontSize: '13px',
            fill: colorToHex(THEMES.dark.textSecondary),
            fontFamily: 'Microsoft YaHei, sans-serif'
        }).setOrigin(0.5);
        s.roomProgressText = roomProgressText;

        // ═══════════════════════════════════════════════════
        //  BOTTOM STATS BAR (all player info moved here)
        // ═══════════════════════════════════════════════════
        const statsY = 649;
        const statsH = 74;
        s.statsY = statsY;

        // Stats bar background
        const statsBg = s.add.graphics();
        s.statsBgGfx = statsBg;
        statsBg.fillStyle(COLORS.headerBg, 0.85);
        statsBg.fillRoundedRect(8, statsY, CANVAS_W - 16, statsH, 10);
        statsBg.lineStyle(1, 0x3a3a6a, 0.5);
        statsBg.strokeRoundedRect(8, statsY, CANVAS_W - 16, statsH, 10);

        // ── HP Display (left) ──
        const hpText = s.add.text(105, statsY + 26, '', {
            fontSize: '13px',
            fill: '#ffffff',
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        s.hpText = hpText;

        // HP bar
        const hpBarBg = s.add.graphics();
        hpBarBg.fillStyle(0x333355, 1);
        hpBarBg.fillRoundedRect(0, 0, 140, 12, 6);
        hpBarBg.x = 44;
        hpBarBg.y = statsY + 44;

        const hpBarFill = s.add.graphics();
        hpBarFill.x = 44;
        hpBarFill.y = statsY + 44;
        s.hpBarFill = hpBarFill;

        // ── Weapon Display (right, prominent) ──
        const weaponAreaX = 375;
        s.add.text(weaponAreaX, statsY + 12, '🗡️ 武器', {
            fontSize: '13px',
            fill: colorToHex(THEMES.dark.textSecondary),
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);

        const weaponText = s.add.text(weaponAreaX, statsY + 33, '无', {
            fontSize: '16px',
            fill: colorToHex(THEMES.dark.textSecondary),
            fontFamily: 'Microsoft YaHei, sans-serif',
            fontStyle: 'bold'
        }).setOrigin(0.5);
        s.weaponText = weaponText;

        // Weapon kill count
        const killCountText = s.add.text(weaponAreaX, statsY + 52, '', {
            fontSize: '11px',
            fill: colorToHex(THEMES.dark.textSecondary),
            fontFamily: 'Microsoft YaHei, sans-serif'
        }).setOrigin(0.5);
        s.killCountText = killCountText;

        // ── Weapon Toggle Button ──
        const toggleW = 110;
        const toggleH = 21;
        const toggleX = weaponAreaX;
        const toggleY = statsY + 67;

        const toggleBg = s.add.graphics();
        s.weaponToggleBg = toggleBg;

        const toggleText = s.add.text(toggleX, toggleY, '', {
            fontSize: '10px',
            fill: colorToHex(THEMES.dark.textWeaponOn),
            fontFamily: 'Microsoft YaHei, sans-serif'
        }).setOrigin(0.5);
        s.weaponToggleText = toggleText;

        const toggleZone = s.add.zone(toggleX, toggleY, toggleW, toggleH)
            .setInteractive({ useHandCursor: true });
        toggleZone.on('pointerdown', () => {
            if (gameState.gameOver || gameState.gameWon) return;
            gameState.useWeapon = !gameState.useWeapon;
            updateWeaponToggle(s);
            renderCards(s);
            if (s.selectedCardIndex >= 0) {
                refreshActionButton(s);
            }
            if (gameState.useWeapon) {
                showMessage(s, '⚔️ 武器已启用');
            } else {
                showMessage(s, '🔒 武器已停用');
            }
        });
        toggleZone.on('pointerover', () => {
            s.tweens.add({ targets: toggleText, scaleX: 1.08, scaleY: 1.08, duration: 80, ease: 'Power2' });
        });
        toggleZone.on('pointerout', () => {
            s.tweens.add({ targets: toggleText, scaleX: 1, scaleY: 1, duration: 80, ease: 'Power2' });
        });
        s.weaponToggleZone = toggleZone;

        // ── Card Slots ──
        // Arrays to hold card display objects
        s.cardBgs = [];
        s.cardTypeLabels = [];
        s.cardValueTexts = [];
        s.cardUnitLabels = [];
        s.cardOverlays = [];
        s.cardStatusTexts = [];
        s.cardContainers = []; // for hover logic
        s.combatPreviewTexts = [];

        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            const cx = CARD_X[i];
            const cy = CARD_Y[i];

            // Empty slot indicator (shown when no card)
            const slotGfx = s.add.graphics();
            slotGfx.lineStyle(1, 0x3a3a6a, 0.5);
            slotGfx.strokeRoundedRect(cx - CARD_W / 2, cy - CARD_H / 2, CARD_W, CARD_H, 14);
            slotGfx.setVisible(false);
            if (!s.slotGfxs) s.slotGfxs = [];
            s.slotGfxs.push(slotGfx);

            // Card background image
            const bg = s.add.image(cx, cy, 'card_monster_d');
            bg.setVisible(false);
            bg.setInteractive({ useHandCursor: true });
            s.cardBgs.push(bg);

            // Type label (top of card)
            const typeLabel = s.add.text(cx, cy - 68, '', {
                fontSize: '25px',
                fill: '#ccccee',
                fontFamily: 'Microsoft YaHei, sans-serif',
            }).setOrigin(0.5).setVisible(false);
            s.cardTypeLabels.push(typeLabel);

            // Value (center, large)
            const valueText = s.add.text(cx, cy + 4, '', {
                fontSize: '36px',
                fill: '#ffffff',
                fontFamily: 'Georgia, serif',
                fontStyle: 'bold'
            }).setOrigin(0.5).setVisible(false);
            s.cardValueTexts.push(valueText);

            // Unit label
            const unitLabel = s.add.text(cx, cy + 42, '', {
                fontSize: '12px',
                fill: '#aaaacc',
                fontFamily: 'Microsoft YaHei, sans-serif',
            }).setOrigin(0.5).setVisible(false);
            s.cardUnitLabels.push(unitLabel);

            // Combat preview text (below bottom line, monsters only)
            const combatPreview = s.add.text(cx, cy + 79, '', {
                fontSize: '12px',
                fill: '#cccccc',
                fontFamily: 'Microsoft YaHei, sans-serif',
                fontStyle: 'bold'
            }).setOrigin(0.5).setVisible(false);
            s.combatPreviewTexts.push(combatPreview);

            // Dark overlay (for processed cards)
            const overlay = s.add.rectangle(cx, cy, CARD_W - 6, CARD_H - 6, COLORS.overlay, 0.55)
                .setVisible(false);
            s.cardOverlays.push(overlay);

            // Status text (DEFEATED / USED / EQUIPPED)
            const statusText = s.add.text(cx, cy + 68, '', {
                fontSize: '12px',
                fill: '#ff8888',
                fontFamily: 'Microsoft YaHei, sans-serif',
                fontStyle: 'bold'
            }).setOrigin(0.5).setVisible(false);
            s.cardStatusTexts.push(statusText);

            // Click handler
            bg.on('pointerdown', () => onCardClick(s, i));
            bg.on('pointerover', () => onCardHover(s, i, true));
            bg.on('pointerout', () => onCardHover(s, i, false));
        }

        // ── Monster Action Button (shared, hidden initially) ──
        s.selectedCardIndex = -1;

        const actionBtnW = 152;
        const actionBtnH = 34;

    // ═══════════════════════════════════════════════════════════════
    //  CARD RENDERING
    // ═══════════════════════════════════════════════════════════════
    function getMonsterIcon(hp) {
        if (hp >= 13) return '💀';      // 13-14: 骷髅
        if (hp >= 10) return '👿';      // 10-12: 恶魔
        if (hp >= 7)  return '👹';      // 7-9: 恶鬼
        if (hp >= 4)  return '👺';      // 4-6: 天狗
        return '👾';                     // 1-3: 小妖
    }

    function renderCards(s) {
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            const card = gameState.roomCards[i];
            const bg = s.cardBgs[i];
            const typeLabel = s.cardTypeLabels[i];
            const valueText = s.cardValueTexts[i];
            const unitLabel = s.cardUnitLabels[i];
            const processed = gameState.roomProcessed[i];

            if (!card) {
                // No card in this slot
                bg.setVisible(false);
                typeLabel.setVisible(false);
                valueText.setVisible(false);
                unitLabel.setVisible(false);
                s.combatPreviewTexts[i].setVisible(false);
                s.cardOverlays[i].setVisible(false);
                s.cardStatusTexts[i].setVisible(false);
                if (s.slotGfxs[i]) s.slotGfxs[i].setVisible(false);
                continue;
            }

            // Set texture
            const suffix = s.theme === 'dark' ? '_d' : '_l';
            const texKey = (card.type === 'monster' ? 'card_monster' :
                            card.type === 'weapon' ? 'card_weapon' : 'card_potion') + suffix;
            bg.setTexture(texKey);
            bg.setVisible(true);

            // Theme-aware text colors
            const t = THEMES[s.theme];
            const txtPri = colorToHex(t.textPrimary);
            const txtSec = colorToHex(t.textSecondary);

            // Type label
            const typeStr = card.type === 'monster' ? getMonsterIcon(card.hp) + ' 敌人' :
                            card.type === 'weapon' ? '⚔️ 武器' : '🧪 血瓶';
            typeLabel.setText(typeStr).setVisible(true).setAlpha(1).setFill(txtSec);

            // Value (monster HP uses darker tone)
            const val = card.type === 'monster' ? card.hp :
                        card.type === 'weapon' ? card.atk : card.heal;
            const valColor = card.type === 'monster' ? (s.theme === 'dark' ? '#c8a090' : '#5a2028') : txtPri;
            valueText.setText(String(val)).setVisible(true).setAlpha(1).setFill(valColor);

            // Unit label
            const unitStr = card.type === 'monster' ? 'HP' :
                            card.type === 'weapon' ? '攻击力' : '恢复';
            unitLabel.setText(unitStr).setVisible(true).setAlpha(1).setFill(txtSec);

            // Combat preview for monsters (below bottom line)
            const cpText = s.combatPreviewTexts[i];
            if (card.type === 'monster' && !processed) {
                const hasWeapon = gameState.weapon && gameState.useWeapon;
                cpText.setVisible(true);
                if (hasWeapon && gameState.weapon.level >= card.hp) {
                    if (gameState.weapon.atk >= card.hp) {
                        cpText.setText('🗡️').setFill('#ffaa33');  // instant kill
                    } else {
                        const dmg = card.hp - gameState.weapon.atk;
                        cpText.setText('🗡️HP-' + dmg).setFill('#ffcc44');  // weapon effective
                    }
                } else {
                    cpText.setText('HP-' + card.hp).setFill('#ff6666');  // no weapon / ineffective
                }
            } else {
                cpText.setVisible(false);
            }

            // Processed state
            if (processed) {
                bg.setTint(0x555555);
                s.cardOverlays[i].setVisible(true).setAlpha(1);
                const statusStr = card.type === 'monster' ? '☠️ 已击败' :
                                  card.type === 'weapon' ? '✅ 已装备' : '✅ 已使用';
                s.cardStatusTexts[i].setText(statusStr).setVisible(true).setAlpha(1).setFill(colorToHex(t.textStatus));
                bg.disableInteractive();
            } else {
                bg.clearTint();
                bg.setAlpha(1);
                s.cardOverlays[i].setVisible(false).setAlpha(1);
                s.cardStatusTexts[i].setVisible(false).setAlpha(1);
                if (!gameState.gameOver && !gameState.gameWon) {
                    bg.setInteractive({ useHandCursor: true });
                }
            }

            if (s.slotGfxs[i]) s.slotGfxs[i].setVisible(false);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  THEME
    // ═══════════════════════════════════════════════════════════════
    function toggleTheme(s) {
        s.theme = (s.theme === 'dark') ? 'light' : 'dark';
        // Re-render everything with new theme
        renderCards(s);
        // Redraw all backgrounds
        redrawBackgrounds(s);
        // Update UI (which also updates text colors)
        updateUI(s);
    }

    function redrawBackgrounds(s) {
        var t = THEMES[s.theme];

        // Full-screen solid background (most reliable method)
        if (!s.solidBg) {
            s.solidBg = s.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, t.bg).setDepth(-1);
        } else {
            s.solidBg.setFillStyle(t.bg);
        }

        // Grid pattern overlay
        s.bgGfx.clear();
        s.bgGfx.fillStyle(t.gridColor, t.gridAlpha);
        for (var x = 0; x < CANVAS_W; x += 60) {
            s.bgGfx.fillRect(x, 0, 1, CANVAS_H);
        }
        for (var y = 0; y < CANVAS_H; y += 60) {
            s.bgGfx.fillRect(0, y, CANVAS_W, 1);
        }

        // Stats bar
        s.statsBgGfx.clear();
        s.statsBgGfx.fillStyle(t.headerBg, 0.85);
        s.statsBgGfx.fillRoundedRect(8, s.statsY, CANVAS_W - 16, 74, 10);
        s.statsBgGfx.lineStyle(1, t.divider, 0.5);
        s.statsBgGfx.strokeRoundedRect(8, s.statsY, CANVAS_W - 16, 74, 10);

        // Message background
        s.msgBgGfx.clear();
        s.msgBgGfx.fillStyle(t.headerBg, 0.6);
        s.msgBgGfx.fillRoundedRect(15, 585, CANVAS_W - 30, 52, 9);
        s.msgBgGfx.lineStyle(1, t.divider, 0.3);
        s.msgBgGfx.strokeRoundedRect(15, 585, CANVAS_W - 30, 52, 9);

        // Top divider
        s.topLineGfx.clear();
        s.topLineGfx.lineStyle(1, t.divider, 0.4);
        s.topLineGfx.lineBetween(15, 41, CANVAS_W - 15, 41);

        // Theme button background
        s.themeBg.clear();
        s.themeBg.fillStyle(t.headerBg, 0.8);
        s.themeBg.fillRoundedRect(57 - 22, 21 - 14, 44, 27, 7);

        // Theme button icon
        s.themeBtnText.setText(s.theme === 'dark' ? '🌙' : '☀️');

        // Next room button — swap texture
        if (s.nextRoomBtnBg) {
            s.nextRoomBtnBg.setTexture('btn_pass_' + (s.theme === 'dark' ? 'd' : 'l'));
        }
    }

    function colorToHex(c) {
        return '#' + c.toString(16).padStart(6, '0');
    }

    function refreshAllTextColors(s) {
        var t = THEMES[s.theme];
        var sec = colorToHex(t.textSecondary);
        var acc = colorToHex(t.textAccent);

        if (s.titleText) s.titleText.setFill(acc);
        if (s.weaponText) s.weaponText.setFill(gameState.weapon ? acc : sec);
        if (s.killCountText) s.killCountText.setFill(sec);
        if (s.messageText) s.messageText.setFill(sec);
        if (s.roomProgressText) s.roomProgressText.setFill(sec);
        if (s.endTitle) s.endTitle.setFill(colorToHex(t.textOverlay));
        if (s.endSubtitle) s.endSubtitle.setFill('#eee8d0');
        if (s.restartText) s.restartText.setFill(colorToHex(t.textButton));
        if (s.nextRoomBtn) {
            try {
                var children = s.nextRoomBtn.getAll ? s.nextRoomBtn.getAll() : s.nextRoomBtn.list || [];
                for (var i = 0; i < children.length; i++) {
                    if (children[i] && children[i].type === 'Text') {
                        children[i].setFill(colorToHex(t.textButton));
                    }
                }
            } catch (e) { /* ignore */ }
        }
    }

    // ═══════════════════════════════════════════════════════════════
    function updateWeaponToggle(s) {
        const toggleBg = s.weaponToggleBg;
        const toggleText = s.weaponToggleText;
        const toggleZone = s.weaponToggleZone;
        const toggleX = 375;
        const toggleY = s.statsY + 67;
        const toggleW = 110;
        const toggleH = 21;

        if (!gameState.weapon || gameState.gameOver || gameState.gameWon) {
            // No weapon — hide toggle
            toggleBg.clear();
            toggleText.setText('').setVisible(false);
            toggleZone.setVisible(false);
            return;
        }

        toggleText.setVisible(true);
        toggleZone.setVisible(true);

        const isOn = gameState.useWeapon;
        toggleBg.clear();

        const t = THEMES[s.theme];
        if (isOn) {
            toggleBg.fillStyle(0x1a5a2a, 0.9);
            toggleBg.fillRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleBg.lineStyle(1, 0x2ecc71, 0.7);
            toggleBg.strokeRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleText.setText('⚔️ 使用武器').setFill(colorToHex(t.textWeaponOn));
        } else {
            toggleBg.fillStyle(t.weaponToggleOffBg, 0.8);
            toggleBg.fillRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleBg.lineStyle(1, t.weaponToggleOffBorder, 0.5);
            toggleBg.strokeRoundedRect(toggleX - toggleW / 2, toggleY - toggleH / 2, toggleW, toggleH, 6);
            toggleText.setText('🔒 不用武器').setFill(colorToHex(t.textWeaponOff));
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  UI UPDATE
    // ═══════════════════════════════════════════════════════════════
    function updateUI(s) {
        // HP
        s.hpText.setText(gameState.playerHP + ' / ' + gameState.maxHP);
        const hpColor = gameState.playerHP > 12 ? COLORS.hpGreen :
                        gameState.playerHP > 5  ? COLORS.hpYellow : COLORS.hpRed;
        s.hpText.setFill('#' + hpColor.toString(16).padStart(6, '0'));
        // Room progress (above cards) — count remaining enemies
        const totalRemaining = countRemainingEnemies();
        s.roomProgressText.setText('房间 ' + (gameState.completedRooms.length + 1) + ' — 剩余敌人 ' + totalRemaining + ' / ' + DECK_MONSTERS);
        s.roomProgressText.setFill(colorToHex(THEMES[s.theme].textSecondary));

        // Theme-consistent secondary text
        s.messageText.setFill(colorToHex(THEMES[s.theme].textSecondary));

        // HP bar
        const hpRatio = Math.max(0, gameState.playerHP / gameState.maxHP);
        const barColor = hpRatio > 0.6 ? COLORS.hpGreen :
                         hpRatio > 0.25 ? COLORS.hpYellow : COLORS.hpRed;
        const barW = Math.max(0, Math.floor(140 * hpRatio));
        s.hpBarFill.clear();
        if (barW > 0) {
            s.hpBarFill.fillStyle(barColor, 0.9);
            s.hpBarFill.fillRoundedRect(0, 0, barW, 12, 6);
            // Highlight
            s.hpBarFill.fillStyle(0xffffff, 0.15);
            s.hpBarFill.fillRoundedRect(0, 0, barW, 6, { tl: 6, tr: 6, bl: 0, br: 0 });
        }

        // Weapon
        const t = THEMES[s.theme];
        if (gameState.weapon) {
            const lvlStr = gameState.weapon.level === Infinity ? '∞' : gameState.weapon.level;
            s.weaponText.setText('攻击力:' + gameState.weapon.atk + '  LV:' + lvlStr);
            s.weaponText.setFill(colorToHex(t.textAccent));
            s.killCountText.setText('已击杀: ' + gameState.weaponKills);
            s.killCountText.setFill(colorToHex(t.textSecondary));
        } else {
            s.weaponText.setText('无');
            s.weaponText.setFill(colorToHex(t.textSecondary));
            s.killCountText.setText('');
        }
        updateWeaponToggle(s);
        updateSkipButton(s);
        refreshAllTextColors(s);

        // Next Room button
        const canPass = gameState.processedCount >= MIN_CARDS_TO_PASS ||
            (gameState.roomCards.filter(Boolean).length < MIN_CARDS_TO_PASS &&
             gameState.processedCount >= gameState.roomCards.filter(Boolean).length);

        if (canPass && !gameState.gameOver && !gameState.gameWon) {
            s.nextRoomBtn.setVisible(true);
            s.tweens.add({
                targets: s.nextRoomBtn,
                alpha: 1,
                duration: 300,
                ease: 'Power2'
            });
        } else {
            s.tweens.add({
                targets: s.nextRoomBtn,
                alpha: 0,
                duration: 200,
                onComplete: () => { if (!canPass || gameState.gameOver || gameState.gameWon) s.nextRoomBtn.setVisible(false); }
            });
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  CARD CLICK HANDLER
    // ═══════════════════════════════════════════════════════════════
    function onCardClick(s, index) {
        if (gameState.gameOver || gameState.gameWon) return;
        if (gameState.roomProcessed[index]) return;

        const card = gameState.roomCards[index];
        if (!card) return;

        // Brief click feedback flash
        s.tweens.add({
            targets: s.cardBgs[index],
            scaleX: 0.95,
            scaleY: 0.95,
            duration: 80,
            yoyo: true,
            ease: 'Power2'
        });

        switch (card.type) {
            case 'monster':
            case 'weapon':
            case 'potion':
                if (s.selectedCardIndex === index) {
                    // Clicking the already-selected card → deselect
                    deselectCard(s);
                } else {
                    // Deselect any previous selection, then select this card
                    if (s.selectedCardIndex >= 0) deselectCard(s);
                    selectCard(s, index);
                }
                break;
        }
    }

    function onCardHover(s, index, entering) {
        if (gameState.gameOver || gameState.gameWon) return;
        if (gameState.roomProcessed[index]) return;
        if (!gameState.roomCards[index]) return;

        if (entering) {
            s.tweens.add({
                targets: s.cardBgs[index],
                scaleX: 1.04,
                scaleY: 1.04,
                duration: 120,
                ease: 'Power2'
            });
        } else {
            s.tweens.add({
                targets: s.cardBgs[index],
                scaleX: 1,
                scaleY: 1,
                duration: 120,
                ease: 'Power2'
            });
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  MONSTER SELECTION & COMBAT PREVIEW
    // ═══════════════════════════════════════════════════════════════
    function getCombatPreview(monster) {
        // Returns info about what would happen if the player fights this monster
        const canUseWeapon = gameState.weapon && gameState.useWeapon && gameState.weapon.level >= monster.hp;
        if (canUseWeapon) {
            const remainingHP = monster.hp - gameState.weapon.atk;
            if (remainingHP <= 0) {
                return { instantKill: true, damageToPlayer: 0 };
            } else {
                return { instantKill: false, damageToPlayer: remainingHP };
            }
        }
        return { instantKill: false, damageToPlayer: monster.hp };
    }

    function selectCard(s, index) {
        s.selectedCardIndex = index;
        const cx = CARD_X[index];
        const cy = CARD_Y[index];
        const card = gameState.roomCards[index];

        // Move card up (absolute targets)
        const offsets = [0, -68, 4, 42, 79, 0, 68]; // bg, typeLabel, valueText, unitLabel, combatPreview, overlay, statusText
        const cardObjs = [
            s.cardBgs[index],
            s.cardTypeLabels[index],
            s.cardValueTexts[index],
            s.cardUnitLabels[index],
            s.combatPreviewTexts[index],
            s.cardOverlays[index],
            s.cardStatusTexts[index]
        ];
        cardObjs.forEach((obj, i) => {
            const restY = cy + offsets[i];
            s.tweens.add({ targets: obj, y: restY - 35, duration: 200, ease: 'Back.easeOut' });
        });

        const btnW = 152;
        const btnH = 34;
        const btnY = cy + 102;

        // Compute & show action button (type-specific)
        const btnX = cx;

        s.actionBtnBg.clear();
        s.actionBtnBg.setPosition(btnX - btnW / 2, btnY - btnH / 2);

        if (card.type === 'monster') {
            const preview = getCombatPreview(card);
            const canUse = gameState.weapon && gameState.useWeapon && gameState.weapon.level >= card.hp;
            if (preview.instantKill) {
                // Instant kill — orange
                s.actionBtnBg.fillStyle(0x4a2e00, 0.95);
                s.actionBtnBg.fillRoundedRect(0, 0, btnW, btnH, 8);
                s.actionBtnBg.lineStyle(2, 0xff8800, 0.9);
                s.actionBtnBg.strokeRoundedRect(0, 0, btnW, btnH, 8);
                s.actionBtnText.setText('⚡ 斩杀').setFill('#ffaa33');
            } else if (canUse) {
                // Weapon effective but not instant kill — yellow
                s.actionBtnBg.fillStyle(0x4a3a00, 0.95);
                s.actionBtnBg.fillRoundedRect(0, 0, btnW, btnH, 8);

    function deselectCard(s) {
        if (s.selectedCardIndex < 0) return;
        const index = s.selectedCardIndex;
        s.selectedCardIndex = -1;

        const cy = CARD_Y[index];
        const offsets = [0, -68, 4, 42, 67, 0, 68];
        const cardObjs = [
            s.cardBgs[index],
            s.cardTypeLabels[index],
            s.cardValueTexts[index],
            s.cardUnitLabels[index],
            s.combatPreviewTexts[index],
            s.cardOverlays[index],
            s.cardStatusTexts[index]
        ];
        cardObjs.forEach((obj, i) => {
            const restY = cy + offsets[i];
            s.tweens.add({ targets: obj, y: restY, duration: 180, ease: 'Back.easeIn' });
        });

        // Hide action button
        s.actionBtnBg.setVisible(false);
        s.actionBtnText.setVisible(false);
        s.actionBtnZone.setVisible(false);
    }

    // ═══════════════════════════════════════════════════════════════
    //  COMBAT
    // ═══════════════════════════════════════════════════════════════
    function playInstantKillEffect(s, index) {
        const cx = CARD_X[index];
        const cy = CARD_Y[index];
        const card = s.cardBgs[index];

        // 1. Slash X mark — two quick diagonal lines
        const slashGfx = s.add.graphics().setDepth(10);
        const slashLen = 70;
        slashGfx.lineStyle(3, 0xffffff, 1);
        // Line 1: top-left to bottom-right
        slashGfx.lineBetween(cx - slashLen * 0.55, cy - slashLen * 0.55, cx + slashLen * 0.55, cy + slashLen * 0.55);
        // Line 2: top-right to bottom-left
        slashGfx.lineBetween(cx + slashLen * 0.55, cy - slashLen * 0.55, cx - slashLen * 0.55, cy + slashLen * 0.55);
        s.tweens.add({
            targets: slashGfx,
            alpha: 0, duration: 350, ease: 'Power3',
            onComplete: () => slashGfx.destroy()
        });

        // 2. Second slash — slightly offset, delayed, thicker
        const slashGfx2 = s.add.graphics().setDepth(10);
        slashGfx2.lineStyle(6, 0xffdd44, 0.85);
        const off = 12;
        slashGfx2.lineBetween(cx - slashLen * 0.5 + off, cy - slashLen * 0.5, cx + slashLen * 0.5 + off, cy + slashLen * 0.5);
        slashGfx2.lineBetween(cx + slashLen * 0.5 - off, cy - slashLen * 0.5, cx - slashLen * 0.5 - off, cy + slashLen * 0.5);
        s.tweens.add({
            targets: slashGfx2,
            alpha: 0, duration: 280, delay: 40, ease: 'Power3',
            onComplete: () => slashGfx2.destroy()
        });

        // 3. Card impact pop — quick burst then settle
        s.tweens.add({
            targets: card,
            scaleX: 1.15, scaleY: 1.15,
            duration: 50, ease: 'Power4',
            onComplete: () => {
                s.tweens.add({
                    targets: card,
                    scaleX: 1.0, scaleY: 1.0,
                    duration: 200, ease: 'Back.easeOut'
                });
            }
        });

        // 4. White flash overlay — independent of card tint
        const flashOverlay = s.add.graphics().setDepth(10);
        flashOverlay.fillStyle(0xffffff, 0.7);
        flashOverlay.fillRoundedRect(cx - CARD_W / 2, cy - CARD_H / 2, CARD_W, CARD_H, 14);
        s.tweens.add({
            targets: flashOverlay,
            alpha: 0, duration: 200, ease: 'Power2',
            onComplete: () => flashOverlay.destroy()
        });
    }

    function fightMonster(s, index) {
        const monster = gameState.roomCards[index];
        const originalHP = monster.hp;
        let damageToPlayer;
        let weaponUsed = false;

        // Check if weapon can be used (must be equipped, enabled, and pass level check)
        const canUseWeapon = gameState.weapon && gameState.useWeapon && gameState.weapon.level >= monster.hp;

        if (canUseWeapon) {
            weaponUsed = true;
            gameState.weaponKills++;
            const remainingHP = monster.hp - gameState.weapon.atk;
            if (remainingHP <= 0) {
                // Instant kill!
                damageToPlayer = 0;
                playInstantKillEffect(s, index);
                showMessage(s, '⚡ 武器攻击！攻击力 ' + gameState.weapon.atk +
                    ' vs 敌人 HP ' + originalHP + ' → 秒杀！\n无伤击败敌人！（武器等级降为 ' + originalHP + '）');
            } else {
                // Weapon reduces HP, player takes rest
                damageToPlayer = remainingHP;
                showMessage(s, '⚔️ 武器攻击削减 ' + gameState.weapon.atk + ' 点HP\n' +
                    '敌人剩余 HP ' + remainingHP + '，你受到 ' + remainingHP + ' 点伤害（武器等级降为 ' + originalHP + '）');
            }
            // Update weapon level
            gameState.weapon.level = originalHP;
        } else {
            // No weapon, weapon disabled, or level check failed
            damageToPlayer = monster.hp;
            if (gameState.weapon && !gameState.useWeapon) {
                // Player has weapon but chose not to use it
                showMessage(s, '🔒 武器已手动停用！徒手战斗\n' +
                    '击败敌人（HP ' + monster.hp + '），受到 ' + damageToPlayer + ' 点伤害！（武器等级保持不变）');
            } else if (gameState.weapon) {
                // Level check failed
                showMessage(s, '🔒 武器等级不足！（LV ' +
                    (gameState.weapon.level === Infinity ? '∞' : gameState.weapon.level) +
                    ' < 敌人 HP ' + monster.hp + '）\n徒手战斗，受到 ' + damageToPlayer + ' 点伤害！');
            } else {
                // No weapon at all
                showMessage(s, '👊 徒手战斗！\n击败敌人（HP ' + monster.hp + '），受到 ' + damageToPlayer + ' 点伤害！');
            }
            weaponUsed = false;
        }

        // Apply damage
        gameState.playerHP = Math.max(0, gameState.playerHP - damageToPlayer);

        // Mark defeated
        gameState.roomProcessed[index] = true;
        gameState.processedCount++;
        gameState.roomInteracted = true;

        // Deselect card and hide action button
        deselectCard(s);

        // Screen shake for impact
        if (damageToPlayer > 0) {
            s.cameras.main.shake(200, 0.005 * damageToPlayer);
            // Red flash
            s.cameras.main.flash(150, 255, 0, 0);
        } else if (weaponUsed) {
            // Gold flash for instant kill
            s.cameras.main.flash(150, 255, 200, 0);
        }

        renderCards(s);
        updateUI(s);

        // Check game over
        if (gameState.playerHP <= 0) {
            s.time.delayedCall(600, () => triggerGameOver(s));
        } else if (countRemainingEnemies() === 0) {
            // All enemies defeated — victory!
            s.time.delayedCall(400, () => triggerVictory(s));
        } else {
            // Auto-check if all monsters in room are defeated
            checkAutoPass(s);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  EQUIP WEAPON
    // ═══════════════════════════════════════════════════════════════
    function equipWeapon(s, index) {
        const weaponCard = gameState.roomCards[index];
        const oldWeapon = gameState.weapon;

        gameState.weapon = {
            atk: weaponCard.atk,
            level: Infinity // fresh weapon, infinite level
        };
        gameState.weaponKills = 0;

        gameState.roomProcessed[index] = true;
        gameState.processedCount++;
        gameState.roomInteracted = true;

        // Deselect and hide action button
        deselectCard(s);

        if (oldWeapon) {
            showMessage(s, '🔄 替换武器！旧武器（攻击力 ' + oldWeapon.atk + '）已丢弃\n' +
                '新武器 攻击力 ' + weaponCard.atk + '，等级 ∞（首次击杀后变为敌人HP值）');
        } else {
            showMessage(s, '🗡️ 装备武器！攻击力 ' + weaponCard.atk +
                '\n等级 ∞ — 首次击杀敌人后等级将变为该敌人的HP值');
        }

        renderCards(s);
        updateUI(s);
        checkAutoPass(s);
    }

    // ═══════════════════════════════════════════════════════════════
    //  USE POTION
    // ═══════════════════════════════════════════════════════════════
    function usePotion(s, index) {
        const potionCard = gameState.roomCards[index];
        const healAmount = potionCard.heal;
        const oldHP = gameState.playerHP;
        const actualHeal = Math.min(healAmount, gameState.maxHP - gameState.playerHP);

        gameState.playerHP = Math.min(gameState.maxHP, gameState.playerHP + healAmount);
        gameState.roomProcessed[index] = true;
        gameState.processedCount++;
        gameState.roomInteracted = true;

        // Deselect and hide action button
        deselectCard(s);

        if (actualHeal < healAmount) {
            showMessage(s, '🧪 使用血瓶！恢复 ' + actualHeal + ' 点生命（已达上限）\n' +
                'HP: ' + oldHP + ' → ' + gameState.playerHP);
        } else if (actualHeal === 0) {
            showMessage(s, '🧪 使用血瓶！但生命值已满，没有效果');
        } else {
            showMessage(s, '🧪 使用血瓶！恢复 ' + actualHeal + ' 点生命\n' +
                'HP: ' + oldHP + ' → ' + gameState.playerHP);
        }

        // Green flash for healing
        if (actualHeal > 0) {
            s.cameras.main.flash(150, 0, 255, 100);
        }

        renderCards(s);
        updateUI(s);
        checkAutoPass(s);
    }

    // ═══════════════════════════════════════════════════════════════
    //  ROOM MANAGEMENT
    // ═══════════════════════════════════════════════════════════════
    function drawRoom(s, carryOver) {
        gameState.roomCards = [];
        gameState.roomProcessed = [];
        gameState.processedCount = 0;
        gameState.roomInteracted = false;

        // First, place any carry-over cards from the previous room
        if (carryOver && carryOver.length > 0) {
            for (let i = 0; i < carryOver.length; i++) {
                gameState.roomCards.push(carryOver[i]);
                gameState.roomProcessed.push(false);
            }
        }

        // Then draw remaining cards from deck to fill 4 slots
        const need = CARDS_PER_ROOM - gameState.roomCards.length;
        for (let i = 0; i < need; i++) {
            if (gameState.deck.length > 0) {
                gameState.roomCards.push(gameState.deck.shift());
                gameState.roomProcessed.push(false);
            } else {
                gameState.roomCards.push(null);
                gameState.roomProcessed.push(true);
            }
        }

        // Determine room ID: use existing roomId from any card, or assign new
        let existingId = 0;
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            if (gameState.roomCards[i] && gameState.roomCards[i].roomId) {
                existingId = gameState.roomCards[i].roomId;
                break;
            }
        }

        if (existingId > 0 && !carryOver) {
            // Skipped room returning — keep original roomId
            gameState.currentRoomId = existingId;
        } else {
            // New room (or carry-over) — assign fresh roomId to all cards
            gameState.currentRoomId = gameState.nextRoomId;
            for (let i = 0; i < CARDS_PER_ROOM; i++) {
                if (gameState.roomCards[i]) {
                    gameState.roomCards[i].roomId = gameState.nextRoomId;
                }
            }
            gameState.nextRoomId++;
        }
    }

    function countRemainingEnemies() {
        var deckEnemies = gameState.deck.filter(function(c) { return c.type === 'monster'; }).length;
        var roomEnemies = 0;
        for (var i = 0; i < CARDS_PER_ROOM; i++) {
            var c = gameState.roomCards[i];
            if (c && c.type === 'monster' && !gameState.roomProcessed[i]) {
                roomEnemies++;
            }
        }
        return deckEnemies + roomEnemies;
    }

    function passRoom(s) {
        if (gameState.gameOver || gameState.gameWon) return;

        // Deselect any selected card
        deselectCard(s);

        // Check if all enemies are defeated — if so, player wins!
        if (countRemainingEnemies() === 0) {
            triggerVictory(s);
            return;
        }

        // Mark current room as completed
        if (gameState.completedRooms.indexOf(gameState.currentRoomId) < 0) {
            gameState.completedRooms.push(gameState.currentRoomId);
        }
        gameState.canSkip = true; // re-enable skip after normal room pass

        // Collect unprocessed cards to carry over + record their old slot indices
        const carryOver = [];
        const carryOldIndices = []; // old slot positions for animation
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            if (gameState.roomCards[i] && !gameState.roomProcessed[i]) {
                carryOver.push(gameState.roomCards[i]);
                carryOldIndices.push(i);
            }
        }

        // Fade out ONLY processed cards (carry-overs stay visible)
        const fadeTargets = [];
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            if (gameState.roomProcessed[i] || !gameState.roomCards[i]) {
                fadeTargets.push(s.cardBgs[i]);
                fadeTargets.push(s.cardTypeLabels[i]);
                fadeTargets.push(s.cardValueTexts[i]);
                fadeTargets.push(s.cardUnitLabels[i]);
                fadeTargets.push(s.combatPreviewTexts[i]);
                fadeTargets.push(s.cardOverlays[i]);
                fadeTargets.push(s.cardStatusTexts[i]);
            }
        }

        s.tweens.add({
            targets: fadeTargets,
            alpha: 0,
            duration: 250,
            ease: 'Power2',
            onComplete: () => {
                // Draw new room with carry-over cards
                drawRoom(s, carryOver);
                renderCards(s);

                // Animate: carry-over cards stay visible, slide old→new; new cards fly from center
                const deckX = CANVAS_W / 2;
                const deckY = (CARD_Y[0] + CARD_Y[2]) / 2;
                for (let i = 0; i < CARDS_PER_ROOM; i++) {
                    if (!gameState.roomCards[i]) continue;
                    const tx = CARD_X[i];
                    const ty = CARD_Y[i];
                    const isCarryOver = i < carryOver.length;

                    if (isCarryOver) {
                        // Carry-over card: stay fully visible, slide from old to new slot
                        const oldIdx = carryOldIndices[i];
                        const oldX = CARD_X[oldIdx];
                        const oldY = CARD_Y[oldIdx];

                        // Place card + text at old position, fully visible
                        s.cardBgs[i].setPosition(oldX, oldY).setAlpha(1).setScale(1).setVisible(true);
                        s.cardTypeLabels[i].setPosition(oldX, oldY - 68).setAlpha(1).setVisible(true);
                        s.cardValueTexts[i].setPosition(oldX, oldY + 4).setAlpha(1).setVisible(true);
                        s.cardUnitLabels[i].setPosition(oldX, oldY + 42).setAlpha(1).setVisible(true);
                        if (gameState.roomCards[i] && gameState.roomCards[i].type === 'monster') {
                            s.combatPreviewTexts[i].setPosition(oldX, oldY + 79).setAlpha(1).setVisible(true);
                        } else {
                            s.combatPreviewTexts[i].setVisible(false);
                        }

                        // Slide everything together to new position
                        s.tweens.add({
                            targets: s.cardBgs[i],
                            x: tx, y: ty,
                            duration: 400, delay: 100,
                            ease: 'Cubic.easeInOut'
                        });
                        s.tweens.add({
                            targets: s.cardTypeLabels[i],
                            x: tx, y: ty - 68,
                            duration: 400, delay: 100,
                            ease: 'Cubic.easeInOut'
                        });
                        s.tweens.add({
                            targets: s.cardValueTexts[i],
                            x: tx, y: ty + 4,
                            duration: 400, delay: 100,
                            ease: 'Cubic.easeInOut'
                        });
                        s.tweens.add({
                            targets: s.cardUnitLabels[i],
                            x: tx, y: ty + 42,
                            duration: 400, delay: 100,
                            ease: 'Cubic.easeInOut'
                        });
                        s.tweens.add({
                            targets: s.combatPreviewTexts[i],
                            x: tx, y: ty + 79,
                            duration: 400, delay: 100,
                            ease: 'Cubic.easeInOut'
                        });
                    } else {
                        // New card: fly in from center
                        s.cardBgs[i].setPosition(deckX, deckY).setAlpha(0).setScale(0.5).setVisible(true);
                        s.cardTypeLabels[i].setPosition(deckX, deckY - 68).setAlpha(0).setVisible(true);
                        s.cardValueTexts[i].setPosition(deckX, deckY + 4).setAlpha(0).setVisible(true);
                        s.cardUnitLabels[i].setPosition(deckX, deckY + 42).setAlpha(0).setVisible(true);
                        if (gameState.roomCards[i] && gameState.roomCards[i].type === 'monster') {
                            s.combatPreviewTexts[i].setPosition(deckX, deckY + 79).setAlpha(0).setVisible(true);
                        } else {
                            s.combatPreviewTexts[i].setVisible(false);
                        }

                        s.tweens.add({
                            targets: s.cardBgs[i],
                            x: tx, y: ty,
                            alpha: 1,
                            scaleX: 1, scaleY: 1,
                            duration: 400,
                            delay: i * 100,
                            ease: 'Back.easeOut'
                        });
                        s.tweens.add({
                            targets: [s.cardTypeLabels[i], s.cardValueTexts[i], s.cardUnitLabels[i], s.combatPreviewTexts[i]],
                            alpha: 1,
                            duration: 200,
                            delay: i * 100 + 250
                        });
                    }
                    if (!isCarryOver) {
                        s.cardTypeLabels[i].setPosition(tx, ty - 68);
                        s.cardValueTexts[i].setPosition(tx, ty + 4);
                        s.cardUnitLabels[i].setPosition(tx, ty + 42);
                        if (gameState.roomCards[i] && gameState.roomCards[i].type === 'monster') {
                            s.combatPreviewTexts[i].setPosition(tx, ty + 79);
                        }
                    }
                }

                updateUI(s);
                let enterMsg = '🚪 进入第 ' + gameState.currentRoomId +
                    ' 号房间 | 剩余牌堆: ' + gameState.deck.length + ' 张';
                if (carryOver.length > 0) {
                    enterMsg += '\n📥 上房间遗留 ' + carryOver.length + ' 张牌已加入当前房间';
                }
                showMessage(s, enterMsg);
            }
        });
    }

    function skipRoom(s) {
        if (!gameState.canSkip) {
            showMessage(s, '⛔ 不能连续跳过两个房间！需先正常通过一个房间');
            return;
        }
        if (gameState.gameOver || gameState.gameWon) return;
        if (gameState.roomInteracted) {
            showMessage(s, '⛔ 本房间已进行过操作，无法跳过！');
            return;
        }

        // Deselect any selected card
        deselectCard(s);

        // Put current room cards at the bottom of the deck
        for (let i = CARDS_PER_ROOM - 1; i >= 0; i--) {
            if (gameState.roomCards[i]) {
                gameState.deck.push(gameState.roomCards[i]);
            }
        }

        // Disable skip for next room
        gameState.canSkip = false;

        // Fade out old cards
        const fadeTargets = [];
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            fadeTargets.push(s.cardBgs[i]);
            fadeTargets.push(s.cardTypeLabels[i]);
            fadeTargets.push(s.cardValueTexts[i]);
            fadeTargets.push(s.cardUnitLabels[i]);
            fadeTargets.push(s.combatPreviewTexts[i]);
            fadeTargets.push(s.cardOverlays[i]);
            fadeTargets.push(s.cardStatusTexts[i]);
        }

        s.tweens.add({
            targets: fadeTargets,
            alpha: 0,
            duration: 250,
            ease: 'Power2',
            onComplete: () => {
                drawRoom(s);
                renderCards(s);

                // Dealing animation
                animateDealCards(s);

                updateUI(s);
                showMessage(s, '⏭️ 跳过第 ' + gameState.currentRoomId +
                    ' 号房间 | 剩余牌堆: ' + gameState.deck.length + ' 张\n（原房间卡牌已放回牌堆底部）');
            }
        });
    }

    function updateSkipButton(s) {
        const t = THEMES[s.theme];
        const canUse = gameState.canSkip && !gameState.roomInteracted && !gameState.gameOver && !gameState.gameWon;
        s.skipBg.clear();
        if (canUse) {
            s.skipBg.fillStyle(t.skipBgOn, 0.9);
            s.skipBg.fillRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipBg.lineStyle(1, t.skipBorderOn, 0.7);
            s.skipBg.strokeRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipText.setFill(colorToHex(t.textSkipOn));
            s.skipZone.setInteractive({ useHandCursor: true });
        } else {
            s.skipBg.fillStyle(t.skipBgOff, 0.6);
            s.skipBg.fillRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipBg.lineStyle(1, t.skipBorderOff, 0.3);
            s.skipBg.strokeRoundedRect(423 - 46, 21 - 14, 92, 27, 8);
            s.skipText.setFill(colorToHex(t.textSkipOff));
            s.skipZone.disableInteractive();
        }
    }

    function animateDealCards(s, carryCount) {
        const deckX = CANVAS_W / 2;
        const deckY = (CARD_Y[0] + CARD_Y[2]) / 2;
        carryCount = carryCount || 0;

        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            if (!gameState.roomCards[i]) continue;
            const tx = CARD_X[i];
            const ty = CARD_Y[i];
            const isCarryOver = i < carryCount;

            if (isCarryOver) {
                // Carry-over card: stays in place, does a subtle "settle" pulse
                s.cardBgs[i].setAlpha(1).setScale(0.85).setPosition(tx, ty);
                s.cardTypeLabels[i].setAlpha(0).setPosition(tx, ty - 68);
                s.cardValueTexts[i].setAlpha(0).setPosition(tx, ty + 4);
                s.cardUnitLabels[i].setAlpha(0).setPosition(tx, ty + 42);
                if (gameState.roomCards[i] && gameState.roomCards[i].type === 'monster') {
                    s.combatPreviewTexts[i].setAlpha(0).setPosition(tx, ty + 79).setVisible(true);
                } else {
                    s.combatPreviewTexts[i].setVisible(false);
                }

                // Pulse to full size
                s.tweens.add({
                    targets: s.cardBgs[i],
                    scaleX: 1, scaleY: 1,
                    duration: 350,
                    delay: i * 80,
                    ease: 'Back.easeOut'
                });
                // Text fades in with a warm "carried over" color flash
                s.tweens.add({
                    targets: [s.cardTypeLabels[i], s.cardValueTexts[i], s.cardUnitLabels[i], s.combatPreviewTexts[i]],
                    alpha: 1,
                    duration: 300,
                    delay: i * 80 + 150
                });
            } else {
                // New card: fly from center of grid to slot
                s.cardBgs[i].setPosition(deckX, deckY).setAlpha(0).setScale(0.5);
                s.cardTypeLabels[i].setPosition(deckX, deckY - 68).setAlpha(0);
                s.cardValueTexts[i].setPosition(deckX, deckY + 4).setAlpha(0);
                s.cardUnitLabels[i].setPosition(deckX, deckY + 42).setAlpha(0);
                if (gameState.roomCards[i] && gameState.roomCards[i].type === 'monster') {
                    s.combatPreviewTexts[i].setPosition(deckX, deckY + 79).setAlpha(0).setVisible(true);
                } else {
                    s.combatPreviewTexts[i].setVisible(false);
                }

                s.tweens.add({
                    targets: s.cardBgs[i],
                    x: tx, y: ty,
                    alpha: 1,
                    scaleX: 1, scaleY: 1,
                    duration: 400,
                    delay: i * 100,
                    ease: 'Back.easeOut'
                });
                s.tweens.add({
                    targets: [s.cardTypeLabels[i], s.cardValueTexts[i], s.cardUnitLabels[i], s.combatPreviewTexts[i]],
                    alpha: 1,
                    duration: 200,
                    delay: i * 100 + 250
                });
            }

            // Set final text positions
            s.cardTypeLabels[i].setPosition(tx, ty - 68);
            s.cardValueTexts[i].setPosition(tx, ty + 4);
            s.cardUnitLabels[i].setPosition(tx, ty + 42);
            if (gameState.roomCards[i] && gameState.roomCards[i].type === 'monster') {
                s.combatPreviewTexts[i].setPosition(tx, ty + 79);
            }
        }
    }

    function checkAutoPass(s) {
        // Check if all non-null cards are processed
        const activeCards = gameState.roomCards.filter(c => c !== null).length;
        if (gameState.processedCount >= MIN_CARDS_TO_PASS && activeCards >= MIN_CARDS_TO_PASS) {
            // Notify player they can proceed
            if (gameState.processedCount === activeCards) {
                showMessage(s, '✅ 本房间所有卡牌已处理完毕！点击下方按钮进入下一房间');
            }
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  MESSAGING
    // ═══════════════════════════════════════════════════════════════
    function showMessage(s, text) {
        s.messageText.setText(text);
        // Brief scale pop
        s.tweens.add({
            targets: s.messageText,
            scaleX: 1.03,
            scaleY: 1.03,
            duration: 100,
            yoyo: true,
            ease: 'Power2'
        });
    }

    // ═══════════════════════════════════════════════════════════════
    //  GAME OVER / VICTORY
    // ═══════════════════════════════════════════════════════════════
    function triggerGameOver(s) {
        gameState.gameOver = true;
        renderCards(s);
        updateUI(s);

        s.time.delayedCall(400, () => {
            s.endOverlay.setVisible(true);
            s.endTitle.setText('💀 你挂了').setVisible(true);
            const deathMsg = DEATH_MESSAGES[Math.floor(Math.random() * DEATH_MESSAGES.length)];
            s.endSubtitle.setText(
                '你倒在了第 ' + (gameState.completedRooms.length + 1) + ' 个房间\n' + deathMsg
            ).setVisible(true);
            s.restartBtnBg.setVisible(true);
            s.restartText.setVisible(true);
            s.restartZone.setVisible(true);

            // Fade in
            s.endTitle.setAlpha(0);
            s.endSubtitle.setAlpha(0);
            s.tweens.add({ targets: s.endTitle, alpha: 1, duration: 600, ease: 'Power2' });
            s.tweens.add({ targets: s.endSubtitle, alpha: 1, duration: 600, delay: 300, ease: 'Power2' });
        });
    }

    function triggerVictory(s) {
        gameState.gameWon = true;
        renderCards(s);
        updateUI(s);

        s.time.delayedCall(400, () => {
            s.endOverlay.setVisible(true);
            s.endTitle.setText('🏆 恭喜通关！').setVisible(true);
            const victoryMsg = VICTORY_MESSAGES[Math.floor(Math.random() * VICTORY_MESSAGES.length)];
            s.endSubtitle.setText(
                victoryMsg + '\n' +
                '通过 ' + gameState.completedRooms.length + ' 个房间 | 剩余生命: ' + gameState.playerHP + ' / ' + gameState.maxHP
            ).setVisible(true);
            s.restartBtnBg.setVisible(true);
            s.restartText.setVisible(true);
            s.restartZone.setVisible(true);

            s.endTitle.setAlpha(0);
            s.endSubtitle.setAlpha(0);
            s.tweens.add({ targets: s.endTitle, alpha: 1, duration: 600, ease: 'Power2' });
            s.tweens.add({ targets: s.endSubtitle, alpha: 1, duration: 600, delay: 300, ease: 'Power2' });
        });
    }

    function restartGame(s) {
        // Hide overlays
        s.endOverlay.setVisible(false);
        s.endTitle.setVisible(false);
        s.endSubtitle.setVisible(false);
        s.restartBtnBg.setVisible(false);
        s.restartText.setVisible(false);
        s.restartZone.setVisible(false);

        // Reset state
        gameState = resetGameState();
        gameState.deck = generateDeck();
        drawRoom(s);
        renderCards(s);
        updateUI(s);

        // Fade in all card elements
        for (let i = 0; i < CARDS_PER_ROOM; i++) {
            if (gameState.roomCards[i]) {
                s.cardBgs[i].setAlpha(1);
                s.cardTypeLabels[i].setAlpha(1);
                s.cardValueTexts[i].setAlpha(1);
                s.cardUnitLabels[i].setAlpha(1);
            }
        }

        showMessage(s, '🔄 新的冒险开始！共有 ' + DECK_TOTAL + ' 张牌\n选择卡牌开始战斗吧！');
    }
    </script>
